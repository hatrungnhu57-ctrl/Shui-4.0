            <label style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer;">
              <input type="radio" name="calc-comm-type" value="full_share" style="accent-color: var(--primary);" />
              <span>Một phần (100%)</span>
            </label>
            <label style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer;">
              <input type="radio" name="calc-comm-type" value="fixed" style="accent-color: var(--primary);" />
              <span>Số tiền cố định</span>
            </label>
            <label style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer;">
              <input type="radio" name="calc-comm-type" value="percent" style="accent-color: var(--primary);" />
              <span>Tỷ lệ % khác</span>
            </label>
          </div>

          <div id="calc-custom-comm-container" style="display: none; margin-top: 8px;">
            <input type="number" id="calc-custom-comm-val" class="form-control" placeholder="Nhập số tiền hoặc số %" style="padding: 6px;" />
          </div>
        </div>
      </div>

      <!-- KẾT QUẢ TÍNH TOÁN TỰ ĐỘNG THỜI GIAN THỰC -->
      <div class="card highlight" style="border: 2px solid var(--primary); background: #ffffff; padding: 14px;" id="calc-result-box">
        <!-- Rendered dynamically -->
      </div>

      <!-- Nút chia sẻ & In -->
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-outline btn-block" id="btn-calc-share-zalo" style="background: #f0fdf4; border-color: #86efac; color: #166534; font-weight: 700;">
          📲 Sao Chép Bảng Tính Gửi Zalo
        </button>
        <button class="btn btn-outline btn-block" id="btn-calc-print" style="color: var(--text-main);">
          🖨️ In Bảng Tính
        </button>
      </div>

      <!-- BẢNG DỰ TÍNH TẤT CẢ CÁC KỲ TRONG DÂY -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📜 Bảng Dự Tính Tất Cả Các Kỳ (Từ Kỳ 1 Đến Mãn Dây)</div>
        </div>
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">
          (Giả định các kỳ có cùng mức tiền thăm đã nhập để đối chiếu dòng tiền)
        </div>
        <div style="overflow-x: auto; max-height: 300px;">
          <table style="width: 100%; border-collapse: collapse; font-size: 12px; text-align: right;" id="calc-schedule-table">
            <!-- Render schedule table -->
          </table>
        </div>
      </div>
    </div>
  `;

  // Xử lý nạp dữ liệu từ dây hụi có sẵn
  document.getElementById('calc-select-existing-group')?.addEventListener('change', (e) => {
    const gid = e.target.value;
    if (!gid) return;
    const g = groups.find(item => item.id === gid);
    if (!g) return;

    document.getElementById('calc-base-amount').value = g.baseAmount;
    document.getElementById('calc-total-parts').value = g.totalParts;

    const cycles = store.state.cycles.filter(c => c.groupId === g.id);
    const openCycle = cycles.find(c => c.status === 'open') || cycles[cycles.length - 1];
    if (openCycle) {
      document.getElementById('calc-cycle-num').value = openCycle.cycleNumber;
      document.getElementById('calc-winningBid').value = openCycle.winningBidAmount || 0;
    }

    if (g.commissionRate === 100) {
      document.querySelector('input[name="calc-comm-type"][value="full_share"]').checked = true;
    } else {
      document.querySelector('input[name="calc-comm-type"][value="half_share"]').checked = true;
    }

    updateCalculator();
    showToast(`Đã nạp thông số từ dây "${g.name}"!`, 'info');
  });

  // Nút chọn nhanh
  container.querySelectorAll('.btn-quick-amount').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.getElementById('calc-base-amount').value = e.target.getAttribute('data-val');
      updateCalculator();
    });
  });

  container.querySelectorAll('.btn-quick-parts').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.getElementById('calc-total-parts').value = e.target.getAttribute('data-val');
      updateCalculator();
    });
  });

  container.querySelectorAll('.btn-quick-bid').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.getElementById('calc-winning-bid').value = e.target.getAttribute('data-val');
      updateCalculator();
    });
  });

  // Lắng nghe thay đổi input
  ['calc-base-amount', 'calc-total-parts', 'calc-cycle-num', 'calc-winning-bid', 'calc-custom-comm-val'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', updateCalculator);
  });

  container.querySelectorAll('input[name="calc-comm-type"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      const val = e.target.value;
      const customBox = document.getElementById('calc-custom-comm-container');
      const customInp = document.getElementById('calc-custom-comm-val');
      if (val === 'fixed') {
        customBox.style.display = 'block';
        customInp.placeholder = 'Nhập số tiền cố định (VD: 500000)';
        customInp.value = '500000';
      } else if (val === 'percent') {
        customBox.style.display = 'block';
        customInp.placeholder = 'Nhập % tiền thảo (VD: 30)';
        customInp.value = '30';
      } else {
        customBox.style.display = 'none';
      }
      updateCalculator();
    });
  });

  let currentShareText = '';

  function updateCalculator() {
    const baseAmount = Number(document.getElementById('calc-base-amount').value) || 0;
    const totalParts = Number(document.getElementById('calc-total-parts').value) || 0;
    const cycleNum = Number(document.getElementById('calc-cycle-num').value) || 1;
    const bid = Number(document.getElementById('calc-winning-bid').value) || 0;

    const commType = document.querySelector('input[name="calc-comm-type"]:checked')?.value || 'half_share';
    const customCommVal = Number(document.getElementById('calc-custom-comm-val')?.value) || 0;

    const hint = document.getElementById('calc-cycle-hint');
    if (hint) {
      hint.innerText = `(Kỳ ${cycleNum} / ${totalParts} phần)`;
    }

    // Tính toán số phần
    const deadCount = Math.max(0, cycleNum - 1);
    const liveCount = Math.max(0, totalParts - cycleNum);

    const deadDue = baseAmount;
    const liveDue = Math.max(0, baseAmount - bid);

    const totalDead = deadCount * deadDue;
    const totalLive = liveCount * liveDue;
    const grossPot = totalDead + totalLive;

    // Tính tiền đầu thảo
    let commission = 0;
    let commLabel = 'Nửa phần (50%)';
    if (commType === 'full_share') {
      commission = baseAmount;
      commLabel = 'Một phần (100%)';
    } else if (commType === 'fixed') {
      commission = customCommVal;
      commLabel = `Cố định (${formatMoney(customCommVal)})`;
    } else if (commType === 'percent') {
      commission = Math.round((baseAmount * customCommVal) / 100);
      commLabel = `${customCommVal}%`;
    } else {
      commission = Math.round(baseAmount * 0.5);
      commLabel = 'Nửa phần (50%)';
    }

    const netPayout = Math.max(0, grossPot - commission);
    const words = store.numberToVietnameseWords(netPayout);

    const resultBox = document.getElementById('calc-result-box');
    if (resultBox) {
      resultBox.innerHTML = `
        <div style="text-align: center; border-bottom: 2px dashed #bbf7d0; padding-bottom: 10px; margin-bottom: 12px;">
          <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">
            KẾT QUẢ TÍNH TIỀN HỤI KỲ ${cycleNum} (${totalParts} PHẦN)
          </div>
          <div style="font-size: 22px; font-weight: 800; color: var(--primary); margin: 4px 0;">
            ${formatMoney(netPayout)}
          </div>
          <div style="font-size: 12.5px; font-style: italic; color: #166534;">
            (Bằng chữ: ${words})
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px;">
          <!-- Hụi chết -->
          <div style="display: flex; justify-content: space-between; align-items: center; background: #fef2f2; padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--accent);">
            <div>
              <strong style="color: #991b1b;">🔴 Hụi Chết (${deadCount} phần):</strong>
              <div style="font-size: 11px; color: var(--text-muted);">${deadCount} người × ${formatMoney(deadDue)} (đóng đủ gốc)</div>
            </div>
            <strong style="color: #991b1b; font-size: 14px;">${formatMoney(totalDead)}</strong>
          </div>

          <!-- Hụi sống -->
          <div style="display: flex; justify-content: space-between; align-items: center; background: #f0fdf4; padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--primary);">
            <div>
              <strong style="color: #166534;">🟢 Hụi Sống (${liveCount} phần):</strong>
              <div style="font-size: 11px; color: var(--text-muted);">${liveCount} người × ${formatMoney(liveDue)} (đã trừ thăm ${formatMoney(bid)})</div>
            </div>
            <strong style="color: #166534; font-size: 14px;">${formatMoney(totalLive)}</strong>
          </div>

          <!-- Tổng gom -->
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #f8fafc; border-radius: 6px;">
            <span>💰 Tổng tiền gom từ các hụi viên:</span>
            <strong>${formatMoney(grossPot)}</strong>
          </div>

          <!-- Tiền đầu thảo -->
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #fffbeb; border-radius: 6px; color: #b45309;">
            <span>🏷️ Trừ Tiền Đầu Thảo Chủ Hụi (${commLabel}):</span>
            <strong style="color: var(--accent);">- ${formatMoney(commission)}</strong>
          </div>

          <!-- Tiền thực nhận -->
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #ecfdf5; border-radius: 8px; border: 1px solid #86efac; font-size: 14px;">
            <strong style="color: var(--primary-dark);">💵 TIỀN NGƯỜI HỐT THỰC LĨNH:</strong>
            <strong style="color: var(--primary); font-size: 17px;">${formatMoney(netPayout)}</strong>
          </div>
        </div>
      `;
    }

    // Chuẩn bị nội dung sao chép gửi Zalo
    currentShareText = `📢 BẢNG TÍNH TIỀN HỤI & ĐẦU THẢO KỲ ${cycleNum}\n` +
      `- Dây hụi: Góp ${formatMoney(baseAmount)}/phần (${totalParts} phần)\n` +
      `- Mức thăm khui: ${formatMoney(bid)}\n` +
      `-------------------------\n` +
      `🔴 Hụi chết (${deadCount} phần): Đóng ${formatMoney(deadDue)} = ${formatMoney(totalDead)}\n` +
      `🟢 Hụi sống (${liveCount} phần): Đóng ${formatMoney(liveDue)} = ${formatMoney(totalLive)}\n` +
      `💰 Tổng gom: ${formatMoney(grossPot)}\n` +
      `🏷️ Trừ tiền đầu thảo: -${formatMoney(commission)} (${commLabel})\n` +
      `👉 TIỀN NGƯỜI HỐT THỰC NHẬN: ${formatMoney(netPayout)}\n` +
      `📝 Bằng chữ: ${words}\n` +
      `(Ứng dụng Quản lý Sổ Hụi)`;

    // Render bảng dự tính toàn bộ chu kỳ
    renderScheduleTable(baseAmount, totalParts, bid, commission, commLabel);
  }

  function renderScheduleTable(baseAmount, totalParts, bid, commission, commLabel) {
    const table = document.getElementById('calc-schedule-table');
    if (!table) return;

    let rowsHtml = `
      <thead>
        <tr style="background: #f1f5f9; color: var(--text-main); font-weight: 700; border-bottom: 2px solid var(--border-color);">
          <th style="padding: 6px; text-align: center;">Kỳ</th>
          <th style="padding: 6px;">Hụi Chết</th>
          <th style="padding: 6px;">Hụi Sống</th>
          <th style="padding: 6px;">Tổng Gom</th>
          <th style="padding: 6px;">Tiền Thảo</th>
          <th style="padding: 6px; color: var(--primary);">Thực Nhận</th>
        </tr>
      </thead>
      <tbody>
    `;

    for (let c = 1; c <= totalParts; c++) {
      const dCount = c - 1;
      const lCount = totalParts - c;
      const dTot = dCount * baseAmount;
      const lTot = lCount * Math.max(0, baseAmount - bid);
      const gPot = dTot + lTot;
      const nPay = Math.max(0, gPot - commission);

      rowsHtml += `
        <tr style="border-bottom: 1px solid var(--border-color);">
          <td style="padding: 6px; text-align: center; font-weight: 700;">#${c}</td>
          <td style="padding: 6px; color: #991b1b;">${dCount}p (${formatMoney(dTot)})</td>
          <td style="padding: 6px; color: #166534;">${lCount}p (${formatMoney(lTot)})</td>
          <td style="padding: 6px;">${formatMoney(gPot)}</td>
          <td style="padding: 6px; color: var(--accent);">${formatMoney(commission)}</td>
          <td style="padding: 6px; font-weight: 800; color: var(--primary);">${formatMoney(nPay)}</td>
        </tr>
      `;
    }

    rowsHtml += '</tbody>';
    table.innerHTML = rowsHtml;
  }

  // Khởi chạy tính toán lần đầu
  updateCalculator();

  // Sao chép Zalo
  document.getElementById('btn-calc-share-zalo')?.addEventListener('click', () => {
    navigator.clipboard?.writeText(currentShareText);
    showToast('Đã sao chép bảng tính đầy đủ để dán vào nhóm Zalo!', 'success');
  });

  // In
  document.getElementById('btn-calc-print')?.addEventListener('click', () => {
    window.print();
  });
}


/**
 * PHÒNG TRÒ CHUYỆN, ĐẤU HỤI BỎ THĂM KÍN & THEO DÕI SINH LỜI DÂY HỤI (GROUP CHAT & LIVE SECRET BALLOT)
 * Cho phép chia sẻ link mời hụi viên, chat trực tuyến, bỏ thăm kín tự động,
 * thống kê ai hốt kỳ nào, số tiền hốt và tỷ suất sinh lời / lãi lỗ chi tiết từng người.
 */




function renderGroupChatView(container, groupId) {
  const group = store.state.groups.find(g => g.id === groupId);
  if (!group) {
    container.innerHTML = `
      <div class="card" style="text-align: center; padding: 30px;">
        <h3>Không tìm thấy phòng nhóm dây hụi!</h3>
        <button class="btn btn-primary" onclick="window.location.hash='#groups'">Quay lại</button>
      </div>
    `;
    return;
  }

  const cycles = store.state.cycles.filter(c => c.groupId === group.id).sort((a, b) => a.cycleNumber - b.cycleNumber);
  const currentOpenCycle = cycles.find(c => c.status === 'open');
  const groupMembers = store.state.groupMembers.filter(gm => gm.groupId === group.id);
  const currentAcc = store.currentAccount;
  const isOwner = currentAcc.role === 'owner' || group.createdBy === currentAcc.id;

  // Tìm profile tương ứng của tài khoản hiện tại trong danh bạ
  const currentProfile = store.state.profiles.find(p => p.phone && store.normalizePhone(p.phone) === store.normalizePhone(currentAcc.phone));
  const currentMemberSlot = currentProfile ? groupMembers.find(gm => gm.memberProfileId === currentProfile.id) : null;
  const hasHoted = currentMemberSlot && currentMemberSlot.hotedCycles && currentMemberSlot.hotedCycles.length > 0;

  const inviteLink = store.generateGroupInviteLink(group.id);

  container.innerHTML = `
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <!-- Header Phòng Nhóm -->
      <div class="card highlight" style="border-left: 4px solid #2563eb; background: #eff6ff; padding: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <button class="btn btn-sm btn-outline" style="margin-bottom: 4px; padding: 2px 8px; font-size: 11.5px;" onclick="window.location.hash='#group-detail/${group.id}'">
              ← Chi tiết dây
            </button>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 20px;">💬</span>
              <h2 style="font-size: 17px; font-weight: 800; color: #1e40af;">
                ${escapeHtml(group.name)}
              </h2>
            </div>
            <div style="font-size: 12px; color: #3b82f6; margin-top: 2px;">
              Góp <strong>${formatMoney(group.baseAmount)}</strong>/phần • ${groupMembers.length} hụi viên (${group.totalParts} phần)
            </div>
          </div>

          <div style="display: flex; gap: 4px;">
            <button class="btn btn-sm btn-outline" id="btn-share-invite-link" style="background:#ffffff; color:#2563eb; border-color:#93c5fd; font-weight:700; font-size:11.5px; padding:6px 8px;">
              🔗 Mời Hụi Viên
            </button>
          </div>
        </div>

        <!-- 3 Tabs Điều Hướng Trong Nhóm -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px;">
          <button class="btn btn-sm btn-chat-tab btn-primary" id="btn-tab-chat-messages">
            💬 Trò Chuyện
          </button>
          <button class="btn btn-sm btn-chat-tab btn-outline" id="btn-tab-chat-profit">
            📊 Lãi / Lỗ & Lịch Sử
          </button>
          <button class="btn btn-sm btn-chat-tab btn-outline" id="btn-tab-chat-members">
            👥 Thành Viên (${groupMembers.length})
          </button>
        </div>
      </div>

      <!-- NỘI DUNG CHÍNH THEO TỪNG TAB -->
      <div id="group-tab-content-container"></div>

      <!-- MODAL CHIA SẺ LINK VÀO NHÓM & MÃ QR -->
      <div id="modal-share-invite" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
          <div class="modal-header">
            <h3 class="modal-title">🔗 Link Tham Gia Nhóm Dây Hụi</h3>
            <button class="btn btn-sm btn-outline btn-circle" id="btn-close-invite-modal">✕</button>
          </div>
          <div class="modal-body">
            <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">
              Gửi link này cho các Hụi Viên. Khi bấm link, họ sẽ được đưa thẳng vào phòng nhóm này:
            </div>

            <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; word-break: break-all; font-size: 12px; color: var(--primary); font-family: monospace;">
              ${escapeHtml(inviteLink)}
            </div>

            <div style="margin-top: 14px;">
              <button class="btn btn-primary btn-block" id="btn-copy-invite-link-zalo" style="padding: 10px; font-weight: 700;">
                📲 Sao Chép Link Gửi Vào Nhóm Zalo
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Quản lý chuyển tab
  let activeSubTab = 'chat';

  function renderSubTab(tab) {
    const containerEl = document.getElementById('group-tab-content-container');
    if (!containerEl) return;

    if (tab === 'chat') {
      renderChatTab(containerEl);
    } else if (tab === 'profit') {
      renderProfitTab(containerEl);
    } else {
      renderMembersTab(containerEl);
    }
  }

  // --- TAB 1: TRÒ CHUYỆN & BỎ THĂM KÍN TRỰC TUYẾN ---
  function renderChatTab(target) {
    const messages = store.getGroupMessages(group.id);
    const ballots = currentOpenCycle ? store.getCycleBallots(group.id, currentOpenCycle.id) : [];

    target.innerHTML = `
      <!-- WIDGET BỎ THĂM KÍN NỔI BẬT NẾU ĐANG CÓ KỲ MỞ -->

        <div class="card highlight" style="border: 2px solid #f59e0b; background: #fffbeb; padding: 12px; margin-bottom: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">

              <span style="font-size: 20px;">🗳️</span>

            Đã có <strong>${ballots.length}</strong> hụi viên gửi phiếu thăm bí mật.

          <!-- Khung gửi phiếu dành cho hụi viên chưa hốt -->

            <div style="background: #ffffff; border: 1px solid #fed7aa; border-radius: 8px; padding: 10px; margin-top: 8px;">

          <!-- Quyền Chủ Hụi: Nút mở thăm kín & công bố người trúng -->
          ${isOwner ? `
            <div style="margin-top: 8px; display: flex; gap: 6px;">
              <button class="btn btn-primary btn-sm btn-block" id="btn-chat-reveal-ballots" style="background: #d97706; border-color: #b45309; padding: 8px; font-weight: 700;">
                🔓 Mở Thăm Kín & Trao Hụi Cho Người Bỏ Cao Nhất
              </button>
            </div>
          ` : ''}
        </div>
      ` : ''}

      <!-- KHUNG HỘI THOẠI TRỰC TUYẾN (MESSAGES CONTAINER) -->
      <div class="card" style="padding: 10px; display: flex; flex-direction: column; height: 380px; justify-content: space-between;">
        <div class="chat-stream" id="chat-messages-list" style="overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; flex: 1;">
          ${messages.length === 0 ? `
            <div style="text-align: center; color: var(--text-muted); font-size: 12.5px; margin-top: 40px;">
              💬 Chưa có tin nhắn nào trong nhóm.<br/>Hãy gửi lời chào đầu tiên hoặc thông báo khui hụi!
            </div>
          ` : messages.map(msg => {
            const isMe = msg.senderId === currentAcc.id;
            const isSys = msg.type === 'system' || msg.type === 'ballot_submitted' || msg.type === 'draw_result';

            if (isSys) {
              return `
                <div style="text-align: center; margin: 4px 0;">
                  <span style="background: #f1f5f9; color: #475569; font-size: 11.5px; padding: 4px 10px; border-radius: 12px; display: inline-block; border: 1px solid var(--border-color); white-space: pre-line;">
                    ${escapeHtml(msg.text)}
                  </span>
                </div>
              `;
            }

            return `
              <div style="display: flex; flex-direction: column; align-items: ${isMe ? 'flex-end' : 'flex-start'};">
                <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 2px; padding: 0 4px;">
                  ${isMe ? 'Bạn' : `${escapeHtml(msg.senderName)} ${msg.senderRole === 'owner' ? '👑 (Chủ Hụi)' : ''}`} • ${formatDateTime(msg.createdAt)}
                </div>
                <div style="max-width: 80%; background: ${isMe ? 'var(--primary)' : '#ffffff'}; color: ${isMe ? '#ffffff' : 'var(--text-main)'}; padding: 8px 12px; border-radius: 12px; border: 1px solid ${isMe ? 'var(--primary)' : 'var(--border-color)'}; font-size: 13px; word-break: break-word; box-shadow: var(--shadow-sm);">
                  ${escapeHtml(msg.text)}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Khung Nhập Tin Nhắn -->
        <div style="display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-color);">
          <input type="text" id="input-chat-message-text" class="form-control" placeholder="Nhập tin nhắn trao đổi trong nhóm..." style="padding: 8px 10px; font-size: 13px;" />
          <button class="btn btn-primary" id="btn-send-chat-message" style="padding: 8px 14px;">
            📨
          </button>
        </div>
      </div>
    `;

    // Cuộn xuống tin nhắn cuối
    const stream = document.getElementById('chat-messages-list');
    if (stream) stream.scrollTop = stream.scrollHeight;

    // Gửi tin nhắn
    function doSendMessage() {
      const input = document.getElementById('input-chat-message-text');
      const text = input ? input.value.trim() : '';
      if (!text) return;

      store.sendGroupMessage(group.id, text, 'text');
      input.value = '';
      renderSubTab('chat');
    }

    document.getElementById('btn-send-chat-message')?.addEventListener('click', doSendMessage);
    document.getElementById('input-chat-message-text')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doSendMessage();
    });

    // Nộp phiếu thăm kín
    document.getElementById('btn-submit-chat-ballot')?.addEventListener('click', () => {
      const bidVal = document.getElementById('input-chat-bid-amount')?.value;
      if (!bidVal || Number(bidVal) <= 0) {
        showToast('Vui lòng nhập mức tiền thăm hợp lệ!', 'warning');
        return;
      }

      try {
        const memberProfId = currentProfile ? currentProfile.id : currentAcc.id;
        store.submitSecretBallot(group.id, currentOpenCycle.id, memberProfId, Number(bidVal));
        showToast('Đã gửi phiếu thăm kín thành công! Chúc bạn may mắn.', 'success');
        renderSubTab('chat');
      } catch (err) {
        showToast(err.message, 'danger');
      }
    });

    // Mở thăm kín (Chủ hụi)
    document.getElementById('btn-chat-reveal-ballots')?.addEventListener('click', () => {
      const ballots = store.getCycleBallots(group.id, currentOpenCycle.id);
      if (ballots.length === 0) {
        showToast('Chưa có thành viên nào nộp phiếu thăm kín!', 'warning');
        return;
      }

      if (confirm(`Xác nhận mở toàn bộ ${ballots.length} phiếu thăm kín và trao hụi cho người bỏ cao nhất?`)) {
        try {
          const res = store.revealSecretBallots(group.id, currentOpenCycle.id);
          showToast(`Khui hụi thành công! Người trúng: ${res.winningBallot.memberName}`, 'success');
          renderSubTab('chat');
        } catch (err) {
          showToast(err.message, 'danger');
        }
      }
    });
  }

            const isLoss = ms.netProfit < 0;

            return `
              <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <div>
                    <strong>#${idx + 1}. ${escapeHtml(ms.fullName)}</strong> ${ms.nickname ? `(${escapeHtml(ms.nickname)})` : ''}
                    <div style="font-size: 11.5px; color: var(--text-muted);">
                      Tham gia: <strong>${ms.sharesCount} phần</strong> • ${ms.hasHoted ? `🔴 Đã hốt kỳ ${ms.hotedCycles.join(', ')}` : '🟢 Hụi sống'}

      navigator.clipboard?.writeText(text);
      showToast('Đã sao chép bảng sinh lời để gửi vào Zalo!', 'success');

  // --- TAB 3: THÀNH VIÊN & LINK MỜI GIA NHẬP ---
  function renderMembersTab(target) {
    target.innerHTML = `
      <!-- LINK MỜI GIA NHẬP TRỰC TIẾP -->
      <div class="card highlight" style="border: 2px solid #3b82f6; background: #eff6ff; padding: 12px;">
        <div style="font-weight: 700; color: #1e40af; font-size: 13.5px; margin-bottom: 4px;">

        </div>
        <div style="background: #ffffff; padding: 8px; border-radius: 6px; font-size: 11.5px; color: #1d4ed8; word-break: break-all; border: 1px solid #bfdbfe; font-family: monospace;">
          ${escapeHtml(inviteLink)}
        </div>
        <div style="display: flex; gap: 6px; margin-top: 8px;">
          <button class="btn btn-primary btn-sm btn-block" id="btn-copy-link-tab" style="padding: 8px; font-weight: 700;">

        <div class="item-list">
          ${groupMembers.map((gm, idx) => {

    renderSubTab('chat');
  });

  document.getElementById('btn-tab-chat-profit')?.addEventListener('click', () => {
    setActiveTab('btn-tab-chat-profit');
    renderSubTab('profit');
  });

  document.getElementById('btn-tab-chat-members')?.addEventListener('click', () => {
    setActiveTab('btn-tab-chat-members');
    renderSubTab('members');
  });

  function setActiveTab(btnId) {
    container.querySelectorAll('.btn-chat-tab').forEach(b => {
      b.className = 'btn btn-sm btn-chat-tab btn-outline';
    });
    const active = document.getElementById(btnId);
    if (active) active.className = 'btn btn-sm btn-chat-tab btn-primary';
  }

  // Modal chia sẻ link mời
  const modalInvite = document.getElementById('modal-share-invite');
  document.getElementById('btn-share-invite-link')?.addEventListener('click', () => {
    modalInvite.style.display = 'flex';
  });

  document.getElementById('btn-close-invite-modal')?.addEventListener('click', () => {
    modalInvite.style.display = 'none';
  });

  document.getElementById('btn-copy-invite-link-zalo')?.addEventListener('click', () => {

  // Mặc định nạp tab chat
  renderSubTab('chat');
}


/**
 * SỔ HỤI - BỘ ĐIỀU HƯỚNG & KHỞI CHẠY ỨNG DỤNG (MAIN APP CONTROLLER)
 * Hỗ trợ Đa tài khoản, Mã PIN bảo mật, Quản lý VietQR & Sao lưu khôi phục
 */





















class SoHuiApp {
  constructor() {
    this.appContainer = document.getElementById('app-container');
    this.isPinUnlocked = false;
    this.init();
  }

  init() {
    window.addEventListener('hashchange', () => this.handleRoute());

    store.subscribe(() => {
      this.updateHeader();
    });

    cloudSync.onSyncStatusChange(() => {
      this.updateHeader();
    });

    this.renderLayout();

    if (!store.currentAccount) {
      window.location.hash = '#auth';
      this.handleRoute();
    } else if (!window.location.hash || window.location.hash === '#select-role') {
      window.location.hash = '#dashboard';
    } else {
      this.handleRoute();
    }
  }

  renderLayout() {
    this.appContainer.innerHTML = `
      <!-- Header -->
      <header class="app-header" id="main-header">
        <div class="brand-badge" id="btn-home-logo" style="cursor: pointer;">
          <div class="brand-icon">📜</div>
          <span>SỔ HỤI</span>
        </div>
        <div id="header-right" style="display: flex; align-items: center; gap: 8px;">
          <!-- Vai trò & Tài khoản hiện tại -->
        </div>
      </header>

      <!-- Main Content -->
      <main class="app-main" id="main-content"></main>

      <!-- Bottom Nav Bar -->
      <nav class="app-nav" id="main-nav">
        <button class="nav-item" data-route="#dashboard">
          <span class="icon">🏠</span>
          <span>Tổng quan</span>
        </button>
        <button class="nav-item" data-route="#groups">
          <span class="icon">📋</span>
          <span>Dây hụi</span>
        </button>
        <button class="nav-item" data-route="#chats">
          <span class="icon">💬</span>
          <span>Chat Nhóm</span>
        </button>
        <button class="nav-item" data-route="#members">
          <span class="icon">👥</span>
          <span>Danh bạ</span>
        </button>
        <button class="nav-item" data-route="#settings">
          <span class="icon">⚙️</span>
          <span>Cài đặt</span>
        </button>
      </nav>

      <!-- Overlay Khóa Mã PIN (App Lock) -->
      <div id="pin-lock-overlay" class="modal-overlay" style="display: none; background: #0f172a; z-index: 200;">
        <div style="text-align: center; color: #fff; max-width: 320px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <div style="font-size: 44px;">🔒</div>
          <div>
            <h3 style="font-size: 18px; font-weight: 800; color: #fff;">Sổ Hụi Đang Khóa</h3>

          <input type="password" id="input-pin-code" maxlength="6" style="width: 180px; text-align: center; font-size: 24px; letter-spacing: 8px; padding: 10px; border-radius: 8px; border: 2px solid #22c55e; background: #1e293b; color: #fff;" />

            <button class="btn btn-outline btn-block" id="btn-pin-logout" style="color: #94a3b8; border-color: #334155;">Đổi TK</button>
            <button class="btn btn-primary btn-block" id="btn-pin-unlock">Mở Khóa 🔓</button>
          </div>
        </div>
      </div>

      <!-- Modal Phản Hồi của Hụi Viên -->
      <div id="modal-feedback" class="modal-overlay" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title">Gửi Phản Hồi Cho Chủ Hụi</h3>
            <button class="btn btn-sm btn-outline btn-circle" id="btn-close-fb-modal">✕</button>
          </div>

            <div class="form-group">
              <label class="form-label">Loại phản hồi:</label>
              <select id="fb-type" class="form-control form-select">
                <option value="amount">Báo sai lệch số tiền cần đóng</option>
                <option value="receipt">Chưa nhận được biên nhận / hình ảnh</option>
                <option value="schedule">Xin gia hạn thời gian nộp tiền</option>
                <option value="other">Góp ý / Yêu cầu khác</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Nội dung chi tiết:</label>
              <textarea id="fb-content" class="form-control" rows="3" placeholder="Nhập nội dung cần trao đổi với chủ hụi..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" id="btn-cancel-fb" style="flex:1;">Hủy</button>
            <button class="btn btn-primary" id="btn-send-fb" style="flex:2;">📨 Gửi Phản Hồi</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btn-home-logo')?.addEventListener('click', () => {
      window.location.hash = '#dashboard';
    });

    this.appContainer.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const route = btn.getAttribute('data-route');
        window.location.hash = route;
      });
    });

    // Xử lý mã PIN khóa app
    const pinOverlay = document.getElementById('pin-lock-overlay');
    document.getElementById('btn-pin-unlock')?.addEventListener('click', () => {
      const pinVal = document.getElementById('input-pin-code').value;
      if (store.verifyPinCode(pinVal)) {
        this.isPinUnlocked = true;
        pinOverlay.style.display = 'none';
        showToast('Mở khóa sổ thành công!', 'success');
      } else {
        showToast('Mã PIN không đúng, vui lòng thử lại!', 'danger');
        document.getElementById('input-pin-code').value = '';
      }
    });

    document.getElementById('input-pin-code')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btn-pin-unlock')?.click();
      }
    });

    document.getElementById('btn-pin-logout')?.addEventListener('click', () => {
      pinOverlay.style.display = 'none';
      this.isPinUnlocked = true;
      window.location.hash = '#auth';
    });

    // Feedback modal
    const modalFb = document.getElementById('modal-feedback');
    document.getElementById('btn-close-fb-modal')?.addEventListener('click', () => modalFb.style.display = 'none');
    document.getElementById('btn-cancel-fb')?.addEventListener('click', () => modalFb.style.display = 'none');
    document.getElementById('btn-send-fb')?.addEventListener('click', () => {
      const type = document.getElementById('fb-type').value;
      const content = document.getElementById('fb-content').value.trim();
      if (!content) {
        showToast('Vui lòng nhập nội dung phản hồi!', 'warning');
        return;
      }

      store.logAction('RECORD_PAYMENT', 'Payment', 'feedback', `Hụi viên gửi phản hồi (${type}): ${content}`);
      showToast('Đã gửi phản hồi đến Chủ Hụi thành công!', 'success');
      modalFb.style.display = 'none';
      document.getElementById('fb-content').value = '';
    });

    window.showFeedbackModal = (huiName, cycleNum) => {
      modalFb.style.display = 'flex';
      if (huiName && huiName !== 'Chung') {
        document.getElementById('fb-content').value = `Tôi xin phản hồi về dây [${huiName}] kỳ ${cycleNum}: `;
      }
    };

    window.shareGroupInvite = (groupId, name, amount, parts) => {
      const inviteLink = store.generateGroupInviteLink(groupId);
      const shareMsg = `📢 THAM GIA DÂY HỤI [${(name || 'SỔ HỤI').toUpperCase()}]\n- Mức góp: ${formatMoney(amount)}/phần (${parts || 12} phần)\n- Bấm link để vào phòng nhóm trao đổi và bỏ thăm kín:\n${inviteLink}\n(Ứng dụng Quản lý Sổ Hụi)`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareMsg);
      }
      showToast('Đã sao chép link mời và tin nhắn Zalo thành công! Hãy dán gửi vào Zalo.', 'success', 4000);
    };

    this.updateHeader();
  }

  checkPinLock() {
    if (store.currentAccount.pinCode && !this.isPinUnlocked) {
      const pinOverlay = document.getElementById('pin-lock-overlay');
      if (pinOverlay) {
        pinOverlay.style.display = 'flex';
        setTimeout(() => document.getElementById('input-pin-code')?.focus(), 200);
      }
    }
  }

  updateHeader() {
    const headerRight = document.getElementById('header-right');
    if (!headerRight) return;

    const acc = store.currentAccount;
    if (!acc) {
      headerRight.innerHTML = '';
      return;
    }

    const role = store.state?.currentRole || acc.role || 'owner';
    let roleText = 'Chủ Hụi';
    let roleClass = 'owner';
    let roleIcon = '👩‍💼';

    if (role === 'member') {
      roleText = 'Hụi Viên';
      roleClass = 'member';
      roleIcon = '👨‍🌾';
    } else if (role === 'hybrid') {
      roleText = 'Chủ & Hụi Viên';
      roleClass = 'hybrid';
      roleIcon = '🧕';
    }

    const isOnline = cloudSync.isOnline;
    const isSyncing = cloudSync.syncStatus === 'syncing';
    let cloudIcon = isOnline ? '🟢' : '🟡';
    let cloudTooltip = isOnline ? 'Đám mây kết nối trực tuyến' : 'Đang ngoại tuyến (Offline)';
    if (isSyncing) {
      cloudIcon = '🔄';
      cloudTooltip = 'Đang đồng bộ Đám mây...';
    }

    headerRight.innerHTML = `
      <div id="btn-cloud-status-header" title="${cloudTooltip}" style="cursor: pointer; font-size: 11px; background: rgba(0,0,0,0.04); padding: 4px 6px; border-radius: 12px; display: flex; align-items: center; gap: 4px;">
        <span style="${isSyncing ? 'animation: spin 1s linear infinite;' : ''}">${cloudIcon}</span>
        <span style="font-weight: 600; color: var(--text-muted); font-size: 11px;">Cloud</span>
      </div>
      <div class="role-tag ${roleClass}" id="btn-change-role" title="Bấm để đổi vai trò">
        <span>${roleIcon}</span>
        <span>${escapeHtml((acc.fullName || 'Tài khoản').split(' ')[0])} (${roleText})</span>
        <span style="font-size: 10px; opacity: 0.7;">▼</span>
      </div>
      <button class="btn btn-sm btn-outline btn-circle" id="btn-goto-settings-header" title="Cài đặt & Sao lưu">
        ⚙️
      </button>
    `;

    document.getElementById('btn-cloud-status-header')?.addEventListener('click', () => {
      window.location.hash = '#settings';
    });

    document.getElementById('btn-change-role')?.addEventListener('click', () => {
      window.location.hash = '#select-role';
    });

    document.getElementById('btn-goto-settings-header')?.addEventListener('click', () => {
      window.location.hash = '#settings';
    });
  }

  handleRoute() {
    const mainContent = document.getElementById('main-content');
    const navBar = document.getElementById('main-nav');
    const header = document.getElementById('main-header');

    if (!mainContent) return;

    let hash = window.location.hash || (store.currentAccount ? '#dashboard' : '#auth');

    // Nếu chưa đăng nhập, bắt buộc chuyển về màn hình đăng nhập / đăng ký
    if (!store.currentAccount) {
      if (hash !== '#auth' && hash !== '#login' && hash !== '#register') {
        window.location.hash = '#auth';
        return;
      }
    }

    // Cập nhật Nav
    this.appContainer.querySelectorAll('.nav-item').forEach(item => {
      const r = item.getAttribute('data-route');
      if (hash.startsWith(r)) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });

    // 0. Màn hình Xác thực Đăng ký / Đăng nhập (#auth, #login, #register)
    if (hash === '#auth' || hash === '#login') {
      if (navBar) navBar.style.display = 'none';
      if (header) header.style.display = 'none';
      renderAuthView(mainContent, 'login');
      return;
    }

    if (hash === '#register') {
      if (navBar) navBar.style.display = 'none';
      if (header) header.style.display = 'none';
      renderAuthView(mainContent, 'register');
      return;
    }

    // 1. Màn hình chọn vai trò
    if (hash === '#select-role') {
      if (navBar) navBar.style.display = 'none';
      if (header) header.style.display = 'none';
      renderRoleSelector(mainContent);
      return;
    }

    // Kiểm tra khóa PIN đối với các trang bên trong
    this.checkPinLock();

    if (navBar) navBar.style.display = 'grid';
    if (header) header.style.display = 'flex';

    // 2. Dashboard theo vai trò
    if (hash === '#dashboard') {
      if (store.state.currentRole === 'owner') {
        renderOwnerDashboard(mainContent);
      } else if (store.state.currentRole === 'member') {
        renderMemberDashboard(mainContent);
      } else {
        this.renderHybridDashboard(mainContent);
      }
      return;
    }

    // 3. Cài đặt & Sao lưu (#settings)
    if (hash === '#settings') {
      renderSettingsView(mainContent);
      return;
    }

    // 4. Danh bạ hụi viên
    if (hash === '#members') {
      renderMembersDirectory(mainContent);
      return;
    }

    // 5. Tạo dây hụi mới & Sang sổ từ sổ giấy cũ
    if (hash === '#create-group') {
      renderCreateGroup(mainContent);
      return;
    }

    if (hash === '#migrate-ledger') {
      renderMigrateLedgerView(mainContent);
      return;
    }

    // 5b. Mua bán & Sang nhượng chân hụi (#transfer-hui, #transfer-hui/:groupId)
    if (hash === '#transfer-hui' || hash.startsWith('#transfer-hui/')) {
      const groupId = hash.includes('/') ? hash.split('/')[1] : null;
      renderTransferHuiView(mainContent, groupId);
      return;
    }

    // 5c. Máy tính tiền hụi & Tiền đầu thảo thông minh (#calculator)
    if (hash === '#calculator') {
      renderCalculatorView(mainContent);
      return;
    }

    // 5d. Phòng trò chuyện & Đấu hụi bỏ thăm kín (#group-chat/:groupId)
    if (hash.startsWith('#group-chat/')) {
      const groupId = hash.split('/')[1];
      renderGroupChatView(mainContent, groupId);
      return;
    }

    // 5e. Link tham gia dây hụi trực tiếp (#join-group/:groupId)
    if (hash.startsWith('#join-group/')) {
      const groupId = hash.split('/')[1];
      try {
        const res = store.joinGroupByInvite(groupId);
        showToast(`Bạn đã gia nhập thành công Dây hụi "${res.group.name}"!`, 'success');
        window.location.hash = `#group-chat/${groupId}`;
      } catch (err) {
        showToast(err.message, 'danger');
        window.location.hash = '#dashboard';
      }
      return;
    }

    // 5f. Danh sách phòng trò chuyện tất cả dây hụi (#chats)
    if (hash === '#chats') {
      this.renderAllChatsView(mainContent);
      return;
    }

    // 6. Danh sách dây hụi
    if (hash === '#groups') {
      if (store.state.currentRole === 'member') {
        renderMemberDashboard(mainContent);
      } else {
        renderOwnerDashboard(mainContent);
      }
      return;
    }

    // 7. Chi tiết dây hụi (#group-detail/:groupId)
    if (hash.startsWith('#group-detail/')) {
      const groupId = hash.split('/')[1];
      renderGroupDetail(mainContent, groupId);
      return;
    }

    // 8. Khui hụi & Quay random (#draw/:groupId/:cycleId)
    if (hash.startsWith('#draw/')) {
      const parts = hash.split('/');
      const groupId = parts[1];
      const cycleId = parts[2];
      renderDrawScreen(mainContent, groupId, cycleId);
      return;
    }

    // 9. Bảng đóng tiền kỳ (#cycle-payments/:cycleId)
    if (hash.startsWith('#cycle-payments/')) {
      const cycleId = hash.split('/')[1];
      renderCyclePayments(mainContent, cycleId);
      return;
    }

    // 10. Cẩm nang
    if (hash === '#guide') {
      renderGuideView(mainContent);
      return;
    }

    // 11. Nhật ký hoạt động
    if (hash === '#logs') {
      renderLogsView(mainContent);
      return;
    }

    // 12. Quản trị hệ thống & Quản lý người dùng
    if (hash === '#admin') {
      renderAdminView(mainContent);
      return;
    }

    // Fallback
    renderOwnerDashboard(mainContent);
  }

  renderHybridDashboard(container) {
    container.innerHTML = `
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button class="btn btn-sm btn-primary" id="btn-tab-hybrid-owner" style="flex: 1;">
          👩‍💼 Dây Tôi Làm Chủ (${store.state.groups.length})
        </button>
        <button class="btn btn-sm btn-outline" id="btn-tab-hybrid-member" style="flex: 1;">
          👨‍🌾 Chân Hụi Tôi Chơi
        </button>
      </div>
      <div id="hybrid-content-container"></div>
    `;

    const subContainer = document.getElementById('hybrid-content-container');
    renderOwnerDashboard(subContainer);

    document.getElementById('btn-tab-hybrid-owner')?.addEventListener('click', (e) => {
      e.currentTarget.className = 'btn btn-sm btn-primary';
      document.getElementById('btn-tab-hybrid-member').className = 'btn btn-sm btn-outline';
      renderOwnerDashboard(subContainer);
    });

    document.getElementById('btn-tab-hybrid-member')?.addEventListener('click', (e) => {
      e.currentTarget.className = 'btn btn-sm btn-primary';
      document.getElementById('btn-tab-hybrid-owner').className = 'btn btn-sm btn-outline';
      renderMemberDashboard(subContainer);
    });
  }

  renderAllChatsView(container) {
    const role = store.state.currentRole;
    let availableGroups = store.state.groups;

    if (role === 'member') {
      const currentProfile = store.state.profiles.find(p => p.phone === store.state.currentUser.phone) || store.state.profiles[1];
      const memberGroupIds = store.state.groupMembers
        .filter(gm => gm.memberProfileId === currentProfile.id)
        .map(gm => gm.groupId);
      availableGroups = store.state.groups.filter(g => memberGroupIds.includes(g.id));
    }

    container.innerHTML = `
      <div>
        <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">
          💬 Phòng Chat & Đấu Hụi Trực Tuyến
        </h2>
        <div style="font-size: 12.5px; color: var(--text-muted);">
          Danh sách phòng trò chuyện riêng biệt cho từng dây hụi để trao đổi, bỏ thăm kín và mời hụi viên
        </div>
      </div>

      ${availableGroups.length > 0 ? `
        <div class="item-list" style="margin-top: 10px;">
          ${availableGroups.map(grp => {
            const cycles = store.state.cycles.filter(c => c.groupId === grp.id);
            const openCycle = cycles.find(c => c.status === 'open');
            const messages = store.getGroupMessages(grp.id);
            const lastMsg = messages.length > 0 ? messages[messages.length - 1] : null;

            return `
              <div class="card" style="padding: 12px; margin-bottom: 8px; border-left: 4px solid #2563eb;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 40px; height: 40px; border-radius: 10px; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #2563eb;">
                      💬
                    </div>
                    <div>
                      <h4 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 2px;">${escapeHtml(grp.name)}</h4>
                      <div style="font-size: 12px; color: var(--text-muted);">
                        Góp: <strong>${formatMoney(grp.baseAmount)}</strong>/phần • ${grp.totalParts} phần
                      </div>
                    </div>
                  </div>
                  <span class="badge ${openCycle ? 'badge-warning' : 'badge-success'}">
                    ${openCycle ? `Kỳ ${openCycle.cycleNumber} đang mở` : 'Đang hoạt động'}
                  </span>
                </div>

                ${lastMsg ? `
                  <div style="background: #f8fafc; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--text-muted); margin: 8px 0; border: 1px dashed var(--border-color);">
                    <strong>${escapeHtml(lastMsg.senderName)}:</strong> ${escapeHtml(lastMsg.text)}
                  </div>
                ` : `
                  <div style="background: #f8fafc; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #64748b; margin: 8px 0;">
                    💡 Chưa có tin nhắn mới. Bấm vào để bắt đầu thảo luận!
                  </div>
                `}

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
                  <button class="btn btn-sm btn-primary" style="background: #2563eb; border-color: #1d4ed8; font-weight: 700; padding: 8px; font-size: 12px;" onclick="window.location.hash='#group-chat/${grp.id}';">
                    💬 Vào Phòng Chat & Thăm Kín
                  </button>
                  <button class="btn btn-sm btn-outline" style="background: #f0fdf4; border-color: #86efac; color: #166534; font-weight: 700; padding: 8px; font-size: 12px;" onclick="window.shareGroupInvite('${grp.id}', '${escapeHtml(grp.name)}', ${grp.baseAmount}, ${grp.totalParts});">
                    🔗 Mời Zalo (Share)
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      ` : `
        <div class="card" style="text-align: center; padding: 30px 16px; margin-top: 10px;">
          <div style="font-size: 36px; margin-bottom: 8px;">💬</div>
          <h3 style="font-size: 16px; font-weight: 700; color: var(--text-main);">Chưa có phòng chat nào</h3>
          <p style="font-size: 13px; color: var(--text-muted); margin: 6px 0 14px 0;">
            Khi bạn tạo dây hụi mới hoặc tham gia vào dây hụi, phòng trò chuyện riêng sẽ tự động xuất hiện tại đây.
          </p>
          <button class="btn btn-primary" onclick="window.location.hash='#create-group';">
            ➕ Tạo Dây Hụi Mới Ngay
          </button>
        </div>
      `}
    `;
  }
}

// Khởi chạy khi DOM sẵn sàng
function startApp() {
  try {
    if (!window.app) {
      window.app = new SoHuiApp();
    }
  } catch (err) {
    console.error('Lỗi khởi động Sổ Hụi:', err);
    const container = document.getElementById('app-container');
    if (container) {
      container.innerHTML = `
        <div style="padding: 24px; text-align: center; color: #dc2626;">
          <h3>⚠️ Không thể khởi động ứng dụng</h3>
          <p style="font-size: 13px; color: #64748b; margin: 10px 0;">${err.message || 'Lỗi không xác định'}</p>
          <button class="btn btn-primary" onclick="window.location.reload();">🔄 Tải lại trang</button>
        </div>
      `;
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startApp);
} else {
  startApp();
}

  </script>
</body>
</html>
