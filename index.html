              ${profiles.map(p => `<option value="${p.id}">${p.fullName} (${p.nickname}) - ${p.phone}</option>`).join('')}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">2. Chọn Hồ sơ PHỤ TRÙNG (Sẽ bị gộp và ẩn đi):</label>
            <select id="select-duplicate-profile" class="form-control form-select">
              ${profiles.map(p => `<option value="${p.id}">${p.fullName} (${p.nickname}) - ${p.phone}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" id="btn-cancel-merge" style="flex:1;">Hủy</button>
          <button class="btn btn-danger" id="btn-confirm-merge" style="flex:2;">🔗 Xác Nhận Gộp Hồ Sơ</button>
        </div>
      </div>
    </div>
  `;

  // Render danh sách thẻ
  function renderMemberListHTML(list) {
    if (list.length === 0) {
      return `<div style="text-align:center; padding:30px; color:var(--text-muted);">Không tìm thấy hụi viên nào.</div>`;
    }

    return list.map(p => `
      <div class="card" style="border-left: 4px solid ${p.latePaymentCount > 0 || p.creditRating <= 2 ? 'var(--accent)' : 'var(--primary)'};">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <h4 style="font-size: 15.5px; font-weight: 700; color: var(--text-main);">${escapeHtml(p.fullName)}</h4>
              ${p.nickname ? `<span style="font-size: 13px; color: var(--primary); font-weight: 600;">(${escapeHtml(p.nickname)})</span>` : ''}
            </div>
            <div style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">
              📞 <strong>${escapeHtml(p.phone)}</strong> • 📍 ${escapeHtml(p.address) || 'Chưa có địa chỉ'}
            </div>
          </div>
          <div>${getCreditBadge(p.creditRating)}</div>
        </div>

        <!-- Thống kê hụi của thành viên này -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #f8fafc; padding: 8px; border-radius: 8px; font-size: 12px; text-align: center;">
          <div>
            <span style="color: var(--text-muted);">Đang chơi:</span>
            <div style="font-weight: 700; color: var(--primary);">${p.activeHuiCount || 0} dây</div>
          </div>
          <div>
            <span style="color: var(--text-muted);">Đã hốt:</span>
            <div style="font-weight: 700; color: #b45309;">${p.hotedCount || 0} lần</div>
          </div>
          <div>
            <span style="color: var(--text-muted);">Trễ hạn:</span>
            <div style="font-weight: 700; color: ${p.latePaymentCount > 0 ? 'var(--accent)' : 'var(--text-main)'};">${p.latePaymentCount || 0} lần</div>
          </div>
        </div>

        ${p.riskNote ? `
          <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #991b1b;">
            <strong>⚠️ Lưu ý rủi ro:</strong> ${escapeHtml(p.riskNote)}
          </div>
        ` : ''}

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
          <button class="btn btn-sm btn-outline btn-edit-profile" data-id="${escapeHtml(p.id)}">
            ✏️ Sửa
          </button>
          <button class="btn btn-sm btn-outline btn-merge-profile" data-id="${escapeHtml(p.id)}">
            🔗 Gộp hồ sơ
          </button>
        </div>
      </div>
    `).join('');
  }

  // Tìm kiếm tức thì
  const searchInput = document.getElementById('member-search-input');
  searchInput?.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = profiles.filter(p =>
      p.fullName.toLowerCase().includes(q) ||
      (p.nickname && p.nickname.toLowerCase().includes(q)) ||
      p.phone.includes(q)
    );
    const listContainer = document.getElementById('member-list-container');
    if (listContainer) listContainer.innerHTML = renderMemberListHTML(filtered);
    attachListButtons();
  });

  // Sự kiện mở modal thêm mới
  const modalMember = document.getElementById('modal-member-form');
  document.getElementById('btn-open-add-member')?.addEventListener('click', () => {
    document.getElementById('modal-member-title').innerText = 'Thêm Hụi Viên Mới Vào Danh Bạ';
    document.getElementById('form-member-id').value = '';
    document.getElementById('form-member-fullname').value = '';
    document.getElementById('form-member-nickname').value = '';
    document.getElementById('form-member-phone').value = '';
    document.getElementById('form-member-address').value = '';
    document.getElementById('form-member-rating').value = '5';
    document.getElementById('form-member-risknote').value = '';
    document.getElementById('form-member-notes').value = '';
    modalMember.style.display = 'flex';
  });

  document.getElementById('btn-close-member-modal')?.addEventListener('click', () => modalMember.style.display = 'none');
  document.getElementById('btn-cancel-member-form')?.addEventListener('click', () => modalMember.style.display = 'none');

  // Lưu hồ sơ
  document.getElementById('btn-save-member-form')?.addEventListener('click', () => {
    const id = document.getElementById('form-member-id').value;
    const fullName = document.getElementById('form-member-fullname').value.trim();
    const nickname = document.getElementById('form-member-nickname').value.trim();
    const phone = document.getElementById('form-member-phone').value.trim();
    const address = document.getElementById('form-member-address').value.trim();
    const creditRating = document.getElementById('form-member-rating').value;
    const riskNote = document.getElementById('form-member-risknote').value.trim();
    const notes = document.getElementById('form-member-notes').value.trim();

    if (!fullName || !phone) {
      showToast('Vui lòng nhập họ tên và số điện thoại!', 'warning');
      return;
    }

    try {
      if (id) {
        store.updateMemberProfile(id, { fullName, nickname, phone, address, creditRating, riskNote, notes });
        showToast('Cập nhật thông tin hụi viên thành công!', 'success');
      } else {
        store.addMemberProfile({ fullName, nickname, phone, address, creditRating, riskNote, notes });
        showToast('Đã thêm hụi viên mới vào danh bạ!', 'success');
      }
      modalMember.style.display = 'none';
      renderMembersDirectory(container);
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  // Modal Gộp hồ sơ
  const modalMerge = document.getElementById('modal-merge-profiles');
  document.getElementById('btn-close-merge-modal')?.addEventListener('click', () => modalMerge.style.display = 'none');
  document.getElementById('btn-cancel-merge')?.addEventListener('click', () => modalMerge.style.display = 'none');

  document.getElementById('btn-confirm-merge')?.addEventListener('click', () => {
    const primaryId = document.getElementById('select-primary-profile').value;
    const duplicateId = document.getElementById('select-duplicate-profile').value;

    if (primaryId === duplicateId) {
      showToast('Vui lòng chọn 2 hồ sơ khác nhau để gộp!', 'warning');
      return;
    }

    if (confirm('Bạn có chắc chắn muốn gộp toàn bộ lịch sử của hồ sơ phụ vào hồ sơ gốc không? Thao tác này sẽ lưu vết kiểm toán vĩnh viễn.')) {
      try {
        store.mergeProfiles(primaryId, duplicateId);
        showToast('Đã gộp hồ sơ hụi viên thành công!', 'success');
        modalMerge.style.display = 'none';
        renderMembersDirectory(container);
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  });

  function attachListButtons() {
    container.querySelectorAll('.btn-edit-profile').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.currentTarget.getAttribute('data-id');
        const p = store.state.profiles.find(prof => prof.id === id);
        if (p) {
          document.getElementById('modal-member-title').innerText = 'Chỉnh Sửa Hồ Sơ Hụi Viên';
          document.getElementById('form-member-id').value = p.id;
          document.getElementById('form-member-fullname').value = p.fullName;
          document.getElementById('form-member-nickname').value = p.nickname || '';
          document.getElementById('form-member-phone').value = p.phone;
          document.getElementById('form-member-address').value = p.address || '';
          document.getElementById('form-member-rating').value = p.creditRating || 5;
          document.getElementById('form-member-risknote').value = p.riskNote || '';
          document.getElementById('form-member-notes').value = p.notes || '';
          modalMember.style.display = 'flex';
        }
      });
    });

    container.querySelectorAll('.btn-merge-profile').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.currentTarget.getAttribute('data-id');
        document.getElementById('select-primary-profile').value = id;
        modalMerge.style.display = 'flex';
      });
    });
  }

  attachListButtons();
}


/**
 * TẠO DÂY HỤI MỚI & THÊM HỤI VIÊN TỪ DANH BẠ
 * Chọn nhiều hụi viên, nhập số chân tham gia, cảnh báo tự động người có nợ/trễ hạn
 */




function renderCreateGroup(container) {
  const profiles = store.state.profiles.filter(p => !p.isMerged);

  container.innerHTML = `
    <div>
      <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">➕ Tạo Dây Hụi Mới</h2>
      <div style="font-size: 12.5px; color: var(--text-muted);">
        Điền thông tin thỏa thuận và chọn hụi viên trực tiếp từ danh bạ
      </div>
    </div>

    <div class="card">
      <div class="card-title">1. Thông tin quy cách dây hụi</div>

      <div class="form-group">
        <label class="form-label">Tên dây hụi (*):</label>
        <input type="text" id="create-group-name" class="form-control" placeholder="VD: Dây 2 Triệu Chợ Chiều, Dây Tháng 5 Triệu" required />
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div class="form-group">
          <label class="form-label">Mức góp / phần (*):</label>
          <input type="text" id="create-group-amount" class="form-control" placeholder="2.000.000" value="2.000.000" style="font-size: 16px; font-weight: 800; color: var(--primary);" required />
          <div id="create-group-amount-words" style="font-size: 11.5px; color: #166534; margin-top: 3px; font-weight: 600;">
            💡 Bằng chữ: <strong>2 triệu đồng</strong>
          </div>
          <!-- Phím chọn nhanh mức tiền -->
          <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;">
            <button type="button" class="btn btn-sm btn-outline btn-preset-amount" data-amount="500000" style="font-size: 10.5px; padding: 2px 6px;">500k</button>
            <button type="button" class="btn btn-sm btn-outline btn-preset-amount" data-amount="1000000" style="font-size: 10.5px; padding: 2px 6px;">1 tr</button>
            <button type="button" class="btn btn-sm btn-outline btn-preset-amount" data-amount="2000000" style="font-size: 10.5px; padding: 2px 6px;">2 tr</button>
            <button type="button" class="btn btn-sm btn-outline btn-preset-amount" data-amount="3000000" style="font-size: 10.5px; padding: 2px 6px;">3 tr</button>
            <button type="button" class="btn btn-sm btn-outline btn-preset-amount" data-amount="5000000" style="font-size: 10.5px; padding: 2px 6px;">5 tr</button>
            <button type="button" class="btn btn-sm btn-outline btn-preset-amount" data-amount="10000000" style="font-size: 10.5px; padding: 2px 6px;">10 tr</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Tổng số phần hụi (*):</label>
          <input type="number" id="create-group-parts" class="form-control" value="12" min="2" max="60" style="font-size: 16px; font-weight: 800;" required />
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div class="form-group">
          <label class="form-label">Chu kỳ khui:</label>
          <select id="create-group-period" class="form-control form-select">
            <option value="month" selected>Hàng tháng (Tháng/kỳ)</option>
            <option value="half_month">Nửa tháng (15 ngày/kỳ)</option>
            <option value="week">Hàng tuần (Tuần/kỳ)</option>
            <option value="day">Theo ngày (Hụi ngày)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Ngày bắt đầu khơi:</label>
          <input type="date" id="create-group-startdate" class="form-control" value="${new Date().toISOString().split('T')[0]}" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Quy định ngày khui định kỳ:</label>
        <input type="text" id="create-group-rule" class="form-control" placeholder="VD: Mùng 15 Tây hàng tháng, Chiều Thứ 7 hàng tuần lúc 16:00" />
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div class="form-group">
          <label class="form-label">Hình thức khui hụi:</label>
          <select id="create-group-method" class="form-control form-select">
            <option value="bidding" selected>🏷️ Kêu hụi / Bỏ lãi (Đấu giá)</option>
            <option value="secret_ballot">🗳️ Bỏ thăm kín</option>
            <option value="random">🎲 Quay Random ngẫu nhiên</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tiền thảo chủ hụi (*):</label>
          <select id="create-group-comm-type" class="form-control form-select">
            <option value="half_share" selected>Nửa phần (50% của 1 suất góp) - Chuẩn</option>
            <option value="full_share">Một phần (100% của 1 suất góp)</option>
            <option value="fixed">Số tiền cố định (VNĐ/kỳ)</option>
            <option value="percent">Theo % tùy chỉnh</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="group-custom-comm-box" style="display: none;">
        <label class="form-label" id="lbl-custom-comm">Nhập số tiền hoặc số %:</label>
        <input type="text" id="create-group-custom-comm" class="form-control" placeholder="VD: 500.000" />
        <div id="create-group-custom-comm-words" style="font-size: 11.5px; color: #166534; margin-top: 3px; font-weight: 600; display: none;"></div>
      </div>

      <!-- Preview dự tính tiền thảo -->
      <div id="create-group-calc-preview" style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px; font-size: 12.5px; color: #166534; margin-bottom: 10px;">
        💡 <strong>Dự tính tiền thảo:</strong> Mỗi kỳ người hốt trích trả cho Chủ hụi: <strong id="preview-comm-amount" style="color: var(--primary); font-size: 14px;">1.000.000 đ</strong>
      </div>

      <div class="form-group">
        <label class="form-label">Ghi chú & Luật thỏa thuận riêng:</label>
        <textarea id="create-group-notes" class="form-control" rows="2" placeholder="VD: Hụi viên đóng trong 24h; người hốt chịu tiền thảo; trễ hạn chịu phạt..."></textarea>
      </div>
    </div>

    <!-- PHẦN 2: CHỌN HỤI VIÊN TỪ DANH BẠ -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">2. Chọn Hụi Viên & Số phần tham gia</div>
        <span class="badge badge-info" id="badge-parts-counter">Đã chọn: 0 / 12 phần</span>
      </div>

      <p style="font-size: 12.5px; color: var(--text-muted);">
        Chọn thành viên từ danh bạ dùng chung. Hệ thống sẽ tự động hiển thị <strong>cảnh báo đỏ</strong> nếu thành viên đó từng trễ hạn hoặc đang có nợ ở dây khác.
      </p>

      <div class="item-list" style="max-height: 400px; overflow-y: auto;">
        ${profiles.map(p => {
          const hasRisk = p.latePaymentCount > 0 || p.riskNote.length > 0 || p.creditRating <= 2;
          return `
            <div class="card member-select-row" data-id="${p.id}" style="padding: 10px; margin: 0; background: ${hasRisk ? '#fffaf0' : '#ffffff'}; border-color: ${hasRisk ? '#fed7aa' : 'var(--border-color)'};">
              <div style="display: flex; align-items: center; justify-content: space-between;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1;">
                  <input type="checkbox" class="cb-member-select" value="${p.id}" style="width: 18px; height: 18px; accent-color: var(--primary);" />
                  <div>
                    <strong style="font-size: 14px; color: var(--text-main);">${p.fullName}</strong>
                    ${p.nickname ? `<span style="font-size: 12.5px; color: var(--primary); font-weight: 600;">(${p.nickname})</span>` : ''}
                    <div style="font-size: 11.5px; color: var(--text-muted);">📞 ${p.phone}</div>
                  </div>
                </label>

                <!-- Nhập số phần tham gia -->
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span style="font-size: 12px; color: var(--text-muted);">Số phần:</span>
                  <input type="number" class="form-control input-shares-count" data-id="${p.id}" value="1" min="1" max="10" style="width: 55px; padding: 4px 6px; text-align: center;" disabled />
                </div>
              </div>

              <!-- Cảnh báo rủi ro nếu có -->
              ${hasRisk ? `
                <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 4px; padding: 4px 8px; font-size: 11.5px; color: #991b1b; margin-top: 6px;">
                  🚨 <strong>CẢNH BÁO:</strong> Từng trễ hạn ${p.latePaymentCount} lần. ${p.riskNote || ''}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <!-- Tóm tắt & Nút bấm -->
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-outline" id="btn-cancel-create" style="flex: 1;">Hủy bỏ</button>
      <button class="btn btn-primary" id="btn-submit-create-group" style="flex: 2;">🚀 Khởi Tạo Dây Hụi</button>
    </div>
  `;

  // Cập nhật số phần khi click checkbox hoặc thay đổi số phần
  const totalPartsInput = document.getElementById('create-group-parts');
  const counterBadge = document.getElementById('badge-parts-counter');
  const baseAmountInput = document.getElementById('create-group-amount');
  const baseWordsEl = document.getElementById('create-group-amount-words');
  const commTypeSelect = document.getElementById('create-group-comm-type');
  const customCommBox = document.getElementById('group-custom-comm-box');
  const customCommInput = document.getElementById('create-group-custom-comm');
  const customCommWordsEl = document.getElementById('create-group-custom-comm-words');
  const previewCommEl = document.getElementById('preview-comm-amount');

  function updateCommissionPreview() {
    const base = parseNumberFromDots(baseAmountInput.value) || 0;
    const type = commTypeSelect.value;
    let commVal = 0;

    if (type === 'half_share') {
      commVal = Math.round(base * 0.5);
      customCommBox.style.display = 'none';
    } else if (type === 'full_share') {
      commVal = base;
      customCommBox.style.display = 'none';
    } else if (type === 'fixed') {
      customCommBox.style.display = 'block';
      document.getElementById('lbl-custom-comm').innerText = 'Nhập số tiền cố định (VNĐ):';
      commVal = parseNumberFromDots(customCommInput.value) || 0;
    } else if (type === 'percent') {
      customCommBox.style.display = 'block';
      document.getElementById('lbl-custom-comm').innerText = 'Nhập tỷ lệ %:';
      const pct = Number(customCommInput.value.replace(/\D/g, '')) || 0;
      commVal = Math.round((base * pct) / 100);
    }

    if (previewCommEl) {
      previewCommEl.innerText = formatMoney(commVal);
    }
  }

  // Gắn bộ định dạng tiền tệ có dấu chấm
  attachMoneyInput(baseAmountInput, baseWordsEl, () => updateCommissionPreview());
  attachMoneyInput(customCommInput, customCommWordsEl, () => updateCommissionPreview());

  // Xử lý các nút chọn nhanh số tiền
  container.querySelectorAll('.btn-preset-amount').forEach(btn => {
    btn.addEventListener('click', () => {
      const amt = Number(btn.getAttribute('data-amount')) || 0;
      baseAmountInput.value = formatNumberWithDots(amt);
      if (baseWordsEl) {
        baseWordsEl.innerHTML = `💡 Bằng chữ: <strong>${readMoneyToVietnameseWords(amt)}</strong>`;
      }
      updateCommissionPreview();
    });
  });

  commTypeSelect.addEventListener('change', () => {
    if (commTypeSelect.value === 'fixed' && !customCommInput.value) {
      customCommInput.value = '500.000';
    } else if (commTypeSelect.value === 'percent' && !customCommInput.value) {
      customCommInput.value = '30';
    }
    updateCommissionPreview();
  });
  updateCommissionPreview();

  function updateCounter() {
    const targetTotal = Number(totalPartsInput.value) || 0;
    let selectedParts = 0;

    container.querySelectorAll('.cb-member-select:checked').forEach(cb => {
      const id = cb.value;
      const sharesInput = container.querySelector(`.input-shares-count[data-id="${id}"]`);
      if (sharesInput) {
        selectedParts += Number(sharesInput.value) || 1;
      }
    });

    counterBadge.innerText = `Đã chọn: ${selectedParts} / ${targetTotal} phần`;
    if (selectedParts === targetTotal) {
      counterBadge.className = 'badge badge-success';
    } else if (selectedParts > targetTotal) {
      counterBadge.className = 'badge badge-danger';
      counterBadge.innerText += ' (Quá số phần!)';
    } else {
      counterBadge.className = 'badge badge-warning';
    }
  }

  totalPartsInput.addEventListener('input', updateCounter);

  container.querySelectorAll('.cb-member-select').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const id = e.target.value;
      const sharesInput = container.querySelector(`.input-shares-count[data-id="${id}"]`);
      if (sharesInput) {
        sharesInput.disabled = !e.target.checked;
      }
      updateCounter();
    });
  });

  container.querySelectorAll('.input-shares-count').forEach(input => {
    input.addEventListener('input', updateCounter);
  });

  // Hủy
  document.getElementById('btn-cancel-create')?.addEventListener('click', () => {
    window.location.hash = '#dashboard';
  });

  // Gửi tạo dây hụi
  document.getElementById('btn-submit-create-group')?.addEventListener('click', () => {
    const name = document.getElementById('create-group-name').value.trim();
    const baseAmount = parseNumberFromDots(document.getElementById('create-group-amount').value);
    const totalParts = Number(document.getElementById('create-group-parts').value);
    const periodType = document.getElementById('create-group-period').value;
    const startDate = document.getElementById('create-group-startdate').value;
    const openDayRule = document.getElementById('create-group-rule').value.trim();
    const drawMethod = document.getElementById('create-group-method').value;
    const commissionType = document.getElementById('create-group-comm-type').value;
    const customComm = commissionType === 'fixed'
      ? parseNumberFromDots(document.getElementById('create-group-custom-comm')?.value)
      : (Number(document.getElementById('create-group-custom-comm')?.value.replace(/\D/g, '')) || 0);
    const agreementNotes = document.getElementById('create-group-notes').value.trim();

    let commissionRate = 50;
    let commissionAmountFixed = 0;
    if (commissionType === 'half_share') commissionRate = 50;
    else if (commissionType === 'full_share') commissionRate = 100;
    else if (commissionType === 'percent') commissionRate = customComm;
    else if (commissionType === 'fixed') {
      commissionAmountFixed = customComm;
      commissionRate = 0;
    }

    if (!name || !baseAmount || !totalParts) {
      showToast('Vui lòng điền đầy đủ Tên dây, Mức góp và Tổng số phần!', 'warning');
      return;
    }

    // Lấy danh sách thành viên đã chọn
    const selectedMembers = [];
    let selectedTotalParts = 0;
    let hasRiskMembers = [];

    container.querySelectorAll('.cb-member-select:checked').forEach(cb => {
      const pid = cb.value;
      const sharesInput = container.querySelector(`.input-shares-count[data-id="${pid}"]`);
      const count = Number(sharesInput.value) || 1;
      selectedTotalParts += count;

      const prof = profiles.find(p => p.id === pid);
      if (prof && (prof.latePaymentCount > 0 || prof.riskNote.length > 0)) {
        hasRiskMembers.push(prof.fullName);
      }

      selectedMembers.push({
        memberProfileId: pid,
        sharesCount: count
      });
    });

    if (selectedMembers.length === 0) {
      showToast('Vui lòng chọn ít nhất một hụi viên tham gia!', 'warning');
      return;
    }

    if (selectedTotalParts !== totalParts) {
      if (!confirm(`Tổng số phần đã chọn (${selectedTotalParts}) chưa khớp với quy cách dây hụi (${totalParts} phần). Bạn có chắc chắn muốn tiếp tục không?`)) {
        return;
      }
    }

    if (hasRiskMembers.length > 0) {
      if (!confirm(`⚠️ CẢNH BÁO RỦI RO:\nTrong danh sách chọn có thành viên từng trễ hạn / có nợ:\n- ${hasRiskMembers.join('\n- ')}\n\nBạn có chắc chắn muốn thêm những người này vào dây mới không?`)) {
        return;
      }
    }

    try {
      const newGroup = store.createHuiGroup({
        name,
        baseAmount,
        totalParts,
        periodType,
        startDate,
        openDayRule,
        drawMethod,
        commissionType,
        commissionRate,
        commissionAmountFixed,
        agreementNotes
      }, selectedMembers);

      showToast(`Tạo thành công dây hụi "${newGroup.name}"!`, 'success');
      window.location.hash = `#group-detail/${newGroup.id}`;
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  updateCounter();
}

  function createSettlementCardHtml(settlement, winnerProf) {
    return `

  // --- 1. CHẾ ĐỘ QUAY RANDOM (MINH BẠCH) ---
  function renderRandomMode(target) {
    target.innerHTML = `
      <div class="card">
        <div class="card-title">2. Danh sách Hụi Viên đủ điều kiện quay</div>

        <div style="display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 8px 12px; border-radius: 8px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
            <input type="checkbox" id="cb-exclude-debt" checked style="width: 18px; height: 18px; accent-color: var(--accent);" />
            <span>Tự động loại trừ người đang có nợ / trễ hạn (${inDebtMembers.length} người)</span>
          </label>
        </div>

        <div class="item-list" style="max-height: 180px; overflow-y: auto;" id="random-candidates-list"></div>
      </div>

      <!-- SÂN KHẤU LỒNG CẦU QUAY SỐ -->
      <div class="wheel-stage" id="lottery-stage">
        <div style="font-size: 15px; font-weight: 700; color: #fef08a;">LỒNG CẦU XỔ SỐ HỤI MINH BẠCH</div>
        <div class="lottery-cage" id="lottery-cage">
          <div class="lottery-ball" id="lottery-ball">🎲</div>
        </div>
        <div id="lottery-status-text" style="font-size: 13px; color: #94a3b8;">Sẵn sàng quay số ngẫu nhiên</div>

        <button class="btn btn-primary btn-block" id="btn-start-spin" style="background: linear-gradient(135deg, #f59e0b, #d97706); border: none; font-size: 16px; padding: 12px;">
          🎰 BẮT ĐẦU QUAY SỐ NGAY
        </button>
      </div>

      <!-- Khung kết quả người trúng sau khi quay xong -->
      <div id="random-winner-container" style="display: none;"></div>
    `;

    const candidatesList = document.getElementById('random-candidates-list');
    const cbExcludeDebt = document.getElementById('cb-exclude-debt');

    function updateCandidatesList() {
      const excludeDebt = cbExcludeDebt.checked;
      const activeCandidates = excludeDebt ? cleanEligibleMembers : [...cleanEligibleMembers, ...inDebtMembers];

      if (activeCandidates.length === 0) {
        candidatesList.innerHTML = `<div style="color:var(--text-muted); padding:10px;">Không còn ai đủ điều kiện để quay!</div>`;
        return;
      }

      candidatesList.innerHTML = activeCandidates.map(({ gm, prof }, idx) => {
        const isDebt = inDebtMembers.some(d => d.prof.id === prof.id);
        return `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: ${isDebt ? '#fff1f2' : '#f0fdf4'}; border-radius: 6px; font-size: 12.5px;">
            <div>
              <strong>#${idx + 1}. ${escapeHtml(prof.fullName)}</strong> (${escapeHtml(prof.nickname)})

            </span>
          </div>
        `;
      }).join('');
    }

    cbExcludeDebt.addEventListener('change', updateCandidatesList);
    updateCandidatesList();

    // Xử lý hiệu ứng quay số
    let isSpinning = false;
    document.getElementById('btn-start-spin')?.addEventListener('click', () => {
      if (isSpinning) return;

      const excludeDebt = cbExcludeDebt.checked;
      const pool = excludeDebt ? cleanEligibleMembers : [...cleanEligibleMembers, ...inDebtMembers];

      if (pool.length === 0) {
        showToast('Không có ai trong danh sách đủ điều kiện để quay!', 'danger');
        return;

      isSpinning = true;

      const winnerContainer = document.getElementById('random-winner-container');

      const settlement = store.calculateCycleSettlement(group, cycle.cycleNumber, 0, winner.prof.id);

              📞 SĐT: ${escapeHtml(winner.prof.phone)} • 📍 ${escapeHtml(winner.prof.address || 'Miền Tây')}

          </div>

          <!-- Bảng tính toán tự động -->
          ${createSettlementCardHtml(settlement, winner.prof)}

          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
            <button class="btn btn-primary btn-block" id="btn-confirm-random-draw">

            </button>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-outline btn-sm" id="btn-share-result" style="flex: 1;">
                📲 Chia Sẻ Kết Quả (Zalo)

                🔄 Quay Lại (Nếu Có Sự Cố)
              </button>
            </div>
          </div>
        </div>
      `;
      winnerContainer.style.display = 'block';

      // Xác nhận kết quả
      document.getElementById('btn-confirm-random-draw')?.addEventListener('click', () => {
        try {
          const eligibleIds = pool.map(p => p.prof.id);
          const excludedNames = inDebtMembers.map(d => `${d.prof.fullName} (${d.prof.riskNote || 'Có nợ'})`);

          store.executeCycleDraw(cycle.id, winner.prof.id, 0, 'random', {
            eligibleCandidates: eligibleIds,
            excludedCandidates: excludedNames
          });

          showToast(`Đã ghi nhận kết quả khui hụi cho ${winner.prof.fullName}!`, 'success');
          window.location.hash = `#cycle-payments/${cycle.id}`;
        } catch (err) {
          showToast(err.message, 'danger');
        }
      });

      // Chia sẻ kết quả
      document.getElementById('btn-share-result')?.addEventListener('click', () => {
        const text = `📢 KẾT QUẢ KHUI HỤI RANDOM MINH BẠCH\n- Dây hụi: ${group.name}\n- Kỳ khui: Kỳ số ${cycle.cycleNumber}\n- Người trúng: ${winner.prof.fullName} (${winner.prof.nickname})\n- Tổng tiền gom: ${formatMoney(settlement.grossPot)}\n- Trừ tiền đầu thảo: -${formatMoney(settlement.commissionAmount)}\n- Thực giao người hốt: ${formatMoney(settlement.netPayout)}\n- Thời gian: ${timestamp}\n(Ứng dụng Quản lý Sổ Hụi)`;
        navigator.clipboard?.writeText(text);
        showToast('Đã sao chép nội dung kết quả! Bạn có thể dán gửi vào Zalo/Messenger.', 'success');
      });

      // Quay lại
      document.getElementById('btn-redraw')?.addEventListener('click', () => {
        const reason = prompt('Vui lòng nhập lý do quay lại:');

        showToast('Đã lưu lý do quay lại vào nhật ký!', 'info');
        renderModeUI('random');
      });

/**
 * QUẢN LÝ ĐÓNG TIỀN, BIÊN NHẬN, VIETQR, PHIẾU GIAO HỤI & CHỐT SỔ KỲ HỤI (PAYMENTS & SETTLEMENT)
 * Tự động tính toán chi tiết hụi sống, hụi chết, trừ tiền đầu thảo, xuất phiếu giao hụi chuẩn pháp lý
 */




function renderCyclePayments(container, cycleId) {
  const cycle = store.state.cycles.find(c => c.id === cycleId);
  if (!cycle) {
    container.innerHTML = `
      <div class="card" style="text-align: center; padding: 30px;">
        <h3>Không tìm thấy kỳ hụi!</h3>
        <button class="btn btn-primary" onclick="window.location.hash='#groups'">Quay lại</button>
      </div>
    `;
    return;
  }

  const group = store.state.groups.find(g => g.id === cycle.groupId);
  const payments = store.state.payments.filter(p => p.cycleId === cycle.id);
  const winnerProfile = store.state.profiles.find(p => p.id === cycle.winnerMemberProfileId);
  const acc = store.currentAccount;

  // Tính toán lại hoặc lấy thông số quyết toán

  // Sự kiện ghi nhận đóng tiền

    btn.addEventListener('click', (e) => {
      const pid = e.currentTarget.getAttribute('data-id');
      const p = payments.find(pay => pay.id === pid);
      const prof = store.state.profiles.find(prof => prof.id === p.memberProfileId);

      if (p && prof) {
        document.getElementById('form-payment-id').value = p.id;
        document.getElementById('modal-pay-member-name').innerText = `${prof.fullName} (${prof.nickname})`;
        document.getElementById('modal-pay-amount-due').innerText = formatMoney(p.amountDue);
        document.getElementById('form-pay-amount-paid').value = p.amountPaid > 0 ? p.amountPaid : p.amountDue;
        document.getElementById('form-pay-method').value = p.paymentMethod || 'transfer';
        document.getElementById('form-pay-txref').value = p.transactionRef || '';
        document.getElementById('form-pay-note').value = p.note || '';
        modalPay.style.display = 'flex';
      }
    });
  });

  document.getElementById('btn-close-payment-modal')?.addEventListener('click', () => modalPay.style.display = 'none');
  document.getElementById('btn-cancel-pay-modal')?.addEventListener('click', () => modalPay.style.display = 'none');

  document.getElementById('btn-save-payment-modal')?.addEventListener('click', () => {
    const paymentId = document.getElementById('form-payment-id').value;
    const amountPaid = Number(document.getElementById('form-pay-amount-paid').value);
    const paymentMethod = document.getElementById('form-pay-method').value;
    const transactionRef = document.getElementById('form-pay-txref').value.trim();
    const note = document.getElementById('form-pay-note').value.trim();

    if (isNaN(amountPaid) || amountPaid < 0) {
      showToast('Vui lòng nhập số tiền hợp lệ!', 'warning');
      return;
    }

    try {
      store.recordPayment(paymentId, {
        amountPaid,
        paymentMethod,
        transactionRef,
        note
      });

      showToast('Ghi nhận thanh toán thành công!', 'success');
      modalPay.style.display = 'none';
      renderCyclePayments(container, cycle.id);

      showToast(err.message, 'danger');
    }
  });

  // Chốt sổ kỳ hụi
  document.getElementById('btn-close-cycle-action')?.addEventListener('click', () => {
    if (remaining > 0) {
      if (!confirm(`⚠️ CẢNH BÁO:\nHiện tại vẫn còn ${formatMoney(remaining)} chưa được nộp đầy đủ.\nBạn có chắc chắn muốn chốt sổ kỳ này không? (Chủ hụi sẽ ghi nhận nợ cho các thành viên chưa đóng).`)) {
        return;
      }
    } else {
      if (!confirm(`Xác nhận chốt sổ hoàn tất Kỳ ${cycle.cycleNumber} của Dây "${group.name}"? Hệ thống sẽ chuyển sang kỳ tiếp theo.`)) {
        return;
      }
    }

    try {
      store.closeCycle(cycle.id);
      showToast(`Đã chốt sổ thành công Kỳ ${cycle.cycleNumber}!`, 'success');
      window.location.hash = `#group-detail/${group.id}`;
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  // Xuất Excel
  document.getElementById('btn-export-payments-excel')?.addEventListener('click', () => {
    const rows = [
      ['BẢNG KÊ THU TIỀN HỤI - KỲ ' + cycle.cycleNumber + ' - ' + group.name.toUpperCase()],
      ['Ngày khui:', formatDate(cycle.openDate), 'Người hốt:', winnerProfile?.fullName || 'Chưa có', 'Mức thăm:', formatMoney(cycle.winningBidAmount)],
      ['Tổng cần thu:', formatMoney(totalDue), 'Đã thu thực tế:', formatMoney(totalPaid), 'Tiền thảo chủ hụi:', formatMoney(cycle.commissionAmount), 'Thực giao:', formatMoney(cycle.potAmount)],
      [''],
      ['STT', 'Họ và tên', 'Biệt danh', 'Diện hụi', 'Số phần', 'Số tiền phải nộp', 'Thực nộp', 'Hình thức', 'Trạng thái', 'Ghi chú']
    ];

    payments.forEach((p, idx) => {
      const prof = store.state.profiles.find(prof => prof.id === p.memberProfileId);
      rows.push([
        idx + 1,
        prof?.fullName || '',
        prof?.nickname || '',
        p.isDeadHui ? 'Hụi chết' : 'Hụi sống',
        p.sharesCount,
        formatMoney(p.amountDue),
        formatMoney(p.amountPaid),
        p.paymentMethod === 'transfer' ? 'Chuyển khoản' : 'Tiền mặt',
        p.status === 'paid' ? 'Đã nộp đủ' : (p.status === 'late' ? 'Trễ hạn' : 'Chưa nộp'),
        p.note || ''
      ]);
    });

    exportToCSV(`ThuTien_Ky${cycle.cycleNumber}_${group.name.replace(/\s+/g, '_')}.csv`, rows);
    showToast('Đã xuất file báo cáo thu tiền Excel!', 'success');

  // Xem biên nhận

  container.querySelectorAll('.btn-view-receipt-payment').forEach(btn => {

      const payId = e.currentTarget.getAttribute('data-pay-id');

        showReceiptModal(rec);
      } else {
        showToast('Không tìm thấy biên nhận tương ứng!', 'warning');
      }
    });
  });

  document.getElementById('btn-close-receipt-modal')?.addEventListener('click', () => modalReceipt.style.display = 'none');

  function showReceiptModal(rec) {
    const body = document.getElementById('receipt-modal-body');
    body.innerHTML = `
      <div class="receipt-paper" id="printable-receipt">
        <div style="text-align: center; border-bottom: 2px solid #0f172a; padding-bottom: 8px;">
          <h3 style="font-size: 16px; font-weight: 800; letter-spacing: 0.5px;">BIÊN NHẬN ĐÓNG TIỀN HỤI</h3>
          <div style="font-size: 11.5px; color: var(--text-muted);">${rec.shopName || acc.shopName || 'Sổ Hụi Miền Nam'} • Phiếu: <strong>${escapeHtml(rec.receiptNumber)}</strong></div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; margin-top: 6px;">
          <div>👤 Người nộp tiền: <strong>${escapeHtml(rec.payerName)}</strong></div>
          <div>👩‍💼 Người thu tiền: <strong>${escapeHtml(rec.receiverName)}</strong> (Chủ hụi)</div>
          <div>📜 Dây hụi: <strong>${escapeHtml(rec.huiName)}</strong></div>
          <div>🎯 Kỳ đóng: <strong>Kỳ số ${rec.cycleNumber}</strong></div>
          <div>💳 Phương thức: <strong>${escapeHtml(rec.paymentMethod)}</strong></div>
          <div>📅 Ngày giờ lập: <strong>${rec.paymentDate}</strong></div>
          <div style="background: #f8fafc; padding: 8px; border-radius: 6px; margin-top: 4px; border: 1px solid #e2e8f0;">
            <div style="font-size: 12px; color: var(--text-muted);">Số tiền đã thu:</div>
            <div style="font-size: 18px; font-weight: 800; color: var(--primary);">${formatMoney(rec.amount)}</div>
            <div style="font-size: 11.5px; font-style: italic; color: #475569;">(Bằng chữ: ${escapeHtml(rec.amountInWords)})</div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 14px; font-size: 12px; text-align: center;">
          <div>
            <strong>Người nộp tiền</strong><br/>
            <span style="font-size: 10.5px; color: var(--text-muted);">(Ký, ghi rõ họ tên)</span>
            <div style="height: 40px;"></div>
            <span>${escapeHtml(rec.payerName.split('(')[0])}</span>
          </div>
          <div>
            <strong>Người thu tiền (Chủ hụi)</strong><br/>
            <span style="font-size: 10.5px; color: var(--text-muted);">(Đã nhận đủ tiền)</span>
            <div style="height: 40px;"></div>
            <span>${escapeHtml(rec.receiverName.split('(')[0])}</span>
          </div>
        </div>

        <div class="receipt-stamp">ĐÃ THU TIỀN</div>
      </div>
    `;
    modalReceipt.style.display = 'flex';

    document.getElementById('btn-print-receipt')?.addEventListener('click', () => {
      window.print();
    });

    document.getElementById('btn-share-receipt-zalo')?.addEventListener('click', () => {
      const shareText = `🧾 BIÊN NHẬN ĐÓNG TIỀN HỤI [${rec.receiptNumber}]\n- Đơn vị: ${rec.shopName || acc.shopName || 'Sổ Hụi'}\n- Người nộp: ${rec.payerName}\n- Dây hụi: ${rec.huiName} (Kỳ ${rec.cycleNumber})\n- Số tiền: ${formatMoney(rec.amount)} (${rec.amountInWords})\n- Phương thức: ${rec.paymentMethod}\n- Thời gian: ${rec.paymentDate}\n(Ứng dụng Quản lý Sổ Hụi)`;
      navigator.clipboard?.writeText(shareText);
      showToast('Đã sao chép nội dung biên nhận để gửi Zalo!', 'success');

  window.viewReceiptDetail = (recId) => {
    const rec = store.state.receipts.find(r => r.id === recId);

  };
}

          🛡️ Phòng ngừa rủi ro

        <button class="btn btn-sm btn-guide-cat ${activeCategory === 'law' ? 'btn-primary' : 'btn-outline'}" data-cat="law">

        </button>
      </div>

      <!-- Danh sách bài viết cẩm nang (Accordion) -->
      <div class="item-list">

          <div class="card guide-card" data-id="${art.id}" style="cursor: pointer;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <h3 style="font-size: 14.5px; font-weight: 700; color: var(--text-main); flex: 1;">

              </h3>
              <span class="guide-toggle-icon" style="font-size: 14px; color: var(--text-muted); margin-left: 8px;">▼</span>
            </div>
            <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 2px;">
              ${art.summary}
            </p>
            <div class="guide-content" id="content-${art.id}" style="display: none; font-size: 13.5px; line-height: 1.6; border-top: 1px dashed var(--border-color); padding-top: 10px; margin-top: 6px; color: #334155;">
              ${art.content}
            </div>
          </div>
        `).join('')}
      </div>
    `;

    // Gán sự kiện mở rộng bài viết
    container.querySelectorAll('.guide-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.getAttribute('data-id');
        const content = document.getElementById(`content-${id}`);
        const icon = card.querySelector('.guide-toggle-icon');
        if (content) {
          const isOpen = content.style.display === 'block';
          content.style.display = isOpen ? 'none' : 'block';
          if (icon) icon.innerText = isOpen ? '▼' : '▲';
        }
      });
    });

    // Gán sự kiện lọc
    container.querySelectorAll('.btn-guide-cat').forEach(btn => {
      btn.addEventListener('click', (e) => {
        activeCategory = e.currentTarget.getAttribute('data-cat');
        renderHTML();
      });
    });
  }

  renderHTML();
}

        <input type="text" id="admin-search-user" class="form-control" placeholder="🔍 Tìm kiếm theo Họ tên hoặc Số điện thoại..." />
      </div>

      <!-- Danh sách tài khoản -->
      <div id="admin-user-list" style="display: flex; flex-direction: column; gap: 10px;">
        ${renderUserCards(accounts)}
      </div>

      <!-- Modal Đổi Mật Khẩu Hộ Cho Người Dùng -->
      <div id="modal-admin-reset-pwd" class="modal-overlay" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title" id="modal-admin-pwd-title">Đổi Mật Khẩu Cho Người Dùng</h3>
            <button class="btn btn-sm btn-outline btn-circle" id="btn-close-admin-pwd">✕</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="admin-target-phone" />
            <div style="background: #f8fafc; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;">
              Đang hỗ trợ cho: <strong id="admin-target-name" style="color: var(--primary);"></strong><br />
              Số điện thoại: <strong id="admin-target-phone-display"></strong>
            </div>

            <div class="form-group">
              <label class="form-label">Mật khẩu mới cấp cho người này (*):</label>
              <input type="text" id="admin-new-password" class="form-control" placeholder="Ví dụ: 123456" />
              <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 4px;">
                💡 Sau khi bấm lưu, bạn hãy nhắn mật khẩu mới này cho người dùng để họ đăng nhập.
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" id="btn-cancel-admin-pwd" style="flex: 1;">Hủy</button>
            <button class="btn btn-primary" id="btn-confirm-admin-pwd" style="flex: 2;">💾 Cập Nhật & Cấp Mật Khẩu</button>
          </div>
        </div>
      </div>
    </div>
  `;

  function renderUserCards(list) {
    if (list.length === 0) {
      return `<div style="text-align:center; padding: 24px; color: var(--text-muted);">Không tìm thấy tài khoản nào phù hợp.</div>`;
    }

    return list.map(acc => {
      const roleLabel = acc.role === 'owner' ? 'Chủ Hụi' : (acc.role === 'member' ? 'Hụi Viên' : 'Chủ & Hụi Viên');
      const roleBadgeClass = acc.role === 'owner' ? 'badge-success' : (acc.role === 'member' ? 'badge-info' : 'badge-warning');

      return `
        <div class="card" style="padding: 14px; border-left: 4px solid ${acc.isDemo ? '#f59e0b' : 'var(--primary)'};">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="font-size: 22px;">${acc.role === 'owner' ? '👩‍💼' : (acc.role === 'member' ? '👨‍🌾' : '🧕')}</span>
              <div>
                <div style="font-weight: 800; font-size: 14.5px; color: var(--text-main);">
                  ${escapeHtml(acc.fullName)}
                </div>
                <div style="font-size: 12.5px; color: var(--text-muted); margin-top: 1px;">
                  📞 <strong>${escapeHtml(acc.phone)}</strong> • MK hiện tại: <code style="background:#e2e8f0; padding:2px 4px; border-radius:4px; font-weight:700;">${escapeHtml(acc.password)}</code>
                </div>
              </div>
            </div>
            <div>
              <span class="badge ${roleBadgeClass}">${roleLabel}</span>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f8fafc; padding: 8px 10px; border-radius: 8px; font-size: 11.5px; margin-top: 8px;">
            <div>Tiệm: <strong>${escapeHtml(acc.shopName) || 'Không có'}</strong></div>
            <div>Ngân hàng: <strong>${escapeHtml(acc.bankCode || 'VCB')} - ${escapeHtml(acc.accountNumber) || 'Chưa cấu hình'}</strong></div>
            <div>Tạo ngày: ${escapeHtml(acc.createdAt || 'N/A')}</div>
            <div>Trạng thái: <span style="color:#15803d; font-weight:700;">🟢 Đang hoạt động</span></div>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
            <button class="btn btn-sm btn-outline btn-admin-reset-user-pwd" data-phone="${escapeHtml(acc.phone)}" data-name="${escapeHtml(acc.fullName)}">
              🔑 Đổi mật khẩu
            </button>
            <button class="btn btn-sm btn-primary btn-admin-switch-to-user" data-phone="${escapeHtml(acc.phone)}" data-pass="${escapeHtml(acc.password)}">
              🚀 Vào xem sổ
            </button>
            <button class="btn btn-sm btn-outline btn-admin-delete-user" data-id="${escapeHtml(acc.id)}" data-name="${escapeHtml(acc.fullName)}" style="color: var(--accent); border-color: #fecaca;">
              🗑️ Xóa
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  // Tìm kiếm
  const searchInput = document.getElementById('admin-search-user');
  searchInput?.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = accounts.filter(a =>
      a.fullName.toLowerCase().includes(q) ||
      a.phone.includes(q)
    );
    const listEl = document.getElementById('admin-user-list');
    if (listEl) listEl.innerHTML = renderUserCards(filtered);
    attachActionButtons();
  });

  // Nút quay lại
  document.getElementById('btn-admin-back')?.addEventListener('click', () => {
    window.location.hash = '#settings';
  });

  // Modal đổi mật khẩu
  const modalReset = document.getElementById('modal-admin-reset-pwd');
  document.getElementById('btn-close-admin-pwd')?.addEventListener('click', () => modalReset.style.display = 'none');
  document.getElementById('btn-cancel-admin-pwd')?.addEventListener('click', () => modalReset.style.display = 'none');

  document.getElementById('btn-confirm-admin-pwd')?.addEventListener('click', async () => {
    const phone = document.getElementById('admin-target-phone').value;
    const newPass = document.getElementById('admin-new-password').value.trim();

    if (!newPass || newPass.length < 3) {
      showToast('Mật khẩu mới phải có ít nhất 3 ký tự!', 'warning');
      return;
    }

    try {
      await store.resetPassword(phone, newPass);
      showToast(`Đã đổi mật khẩu thành công! Mật khẩu mới là: ${newPass}`, 'success');
      modalReset.style.display = 'none';
      renderAdminView(container);
    } catch (e) {
      showToast(e.message, 'danger');
    }
  });

  function attachActionButtons() {
    // Lưu cấu hình eSMS
    document.getElementById('btn-save-esms-config')?.addEventListener('click', async () => {
      const apiKey = document.getElementById('cfg-esms-apikey').value.trim();
      const secretKey = document.getElementById('cfg-esms-secretkey').value.trim();
      const brandname = document.getElementById('cfg-esms-brandname').value.trim();
      const smsType = document.getElementById('cfg-esms-smstype').value;

      if (!apiKey || !secretKey) {
        showToast('Vui lòng nhập đầy đủ ApiKey và SecretKey từ eSMS.vn!', 'warning');
        return;
      }

      const btnSave = document.getElementById('btn-save-esms-config');
      try {
        btnSave.disabled = true;
        btnSave.innerText = '⏳ Đang lưu...';

        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'save_sms_config',
            apiKey,
            secretKey,
            brandname,
            smsType
          })
        });

        // Backup to persistent cloud store as well
        fetch('https://kvdb.io/4yZJ7vM9L1P3a8Qx5cE7wR/config_esms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey, secretKey, brandname, smsType })
        }).catch(() => {});

        showToast('Đã lưu cấu hình eSMS.vn thành công! Hệ thống sẵn sàng gửi tin nhắn thật.', 'success');
        document.getElementById('sms-config-status').innerText = '🟢 Đã Kích Hoạt';
      } catch (e) {
        showToast('Lỗi lưu cấu hình: ' + e.message, 'danger');
      } finally {
        btnSave.disabled = false;
        btnSave.innerText = '💾 Lưu Cấu Hình & Kích Hoạt Gửi SMS Thật';
      }
    });

    // Mở modal đổi mật khẩu
    container.querySelectorAll('.btn-admin-reset-user-pwd').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const phone = e.currentTarget.getAttribute('data-phone');
        const name = e.currentTarget.getAttribute('data-name');
        document.getElementById('admin-target-phone').value = phone;
        document.getElementById('admin-target-phone-display').innerText = phone;
        document.getElementById('admin-target-name').innerText = name;
        document.getElementById('admin-new-password').value = '123456';
        modalReset.style.display = 'flex';
      });
    });

    // Vào xem sổ của tài khoản đó
    container.querySelectorAll('.btn-admin-switch-to-user').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const phone = e.currentTarget.getAttribute('data-phone');
        const pass = e.currentTarget.getAttribute('data-pass');
        try {
          const acc = await store.login(phone, pass);
          showToast(`Đã chuyển sang sổ của: ${acc.fullName}`, 'success');
          window.location.hash = '#dashboard';
        } catch (err) {
          showToast(err.message, 'danger');
        }
      });
    });

    // Xóa tài khoản
    container.querySelectorAll('.btn-admin-delete-user').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.currentTarget.getAttribute('data-id');
        const name = e.currentTarget.getAttribute('data-name');
        if (confirm(`Bạn có chắc chắn muốn xóa tài khoản "${name}" khỏi hệ thống không?`)) {
          const accs = store.getAccounts().filter(a => a.id !== id);
          store.saveAccounts(accs);
          showToast(`Đã xóa tài khoản ${name}!`, 'info');
          renderAdminView(container);
        }
      });
    });
  }

  attachActionButtons();
}

      <div class="card">

          <button class="btn btn-sm btn-primary" id="btn-quick-add-member">+ Thêm người</button>

        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">

        <div id="mig-member-selection-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; padding: 4px;">
          ${profiles.map((p, idx) => `
            <div class="mig-member-item" data-id="${p.id}" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" class="chk-mig-member" data-id="${p.id}" id="chk-mem-${p.id}" ${idx < 10 ? 'checked' : ''} style="width: 18px; height: 18px;" />
                <label for="chk-mem-${p.id}" style="font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text-main);">
                  ${escapeHtml(p.fullName)} <span style="font-weight: normal; color: var(--text-muted); font-size: 11.5px;">(${escapeHtml(p.phone)})</span>

              </div>

                <input type="number" class="mig-member-shares" data-id="${p.id}" value="1" min="1" max="10" style="width: 50px; text-align: center; padding: 4px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px;" />

        <div class="card-header">
          <div class="card-title" style="color: #991b1b;">3. Lịch Sử Các Kỳ ĐÃ KHUI Trên Sổ Giấy</div>
        </div>
        <div style="font-size: 12.5px; color: #7f1d1d;">
          Dây này trên sổ giấy đã khui được bao nhiêu kỳ rồi? Hệ thống sẽ ghi nhận những người này là <strong>Hụi Chết</strong> và những người còn lại là <strong>Hụi Sống</strong>.
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <label class="form-label" style="font-weight: 800;">Dây này đã khui được mấy kỳ rồi? (*):</label>
          <select id="mig-past-cycles-count" class="form-control form-select" style="font-weight: 700; color: #991b1b;">
            <option value="1">Đã khui 1 kỳ</option>
            <option value="2">Đã khui 2 kỳ</option>
            <option value="3" selected>Đã khui 3 kỳ</option>
            <option value="4">Đã khui 4 kỳ</option>

            <option value="8">Đã khui 8 kỳ</option>
            <option value="9">Đã khui 9 kỳ</option>

            <option value="20">Đã khui 20 kỳ</option>

        </div>
      </div>

      <!-- BƯỚC 4: KỲ TIẾP THEO SẼ KHUI TRÊN APP -->
      <div class="card" style="border-left: 4px solid var(--primary); background: #f0fdf4;">
        <div class="card-header">
          <div class="card-title" style="color: var(--primary-dark);">4. Kỳ Kế Tiếp Sẽ Khui Trên Ứng Dụng</div>
        </div>
        <div class="form-group">
          <label class="form-label">Ngày khui kỳ tiếp theo (*):</label>
          <input type="date" id="mig-next-cycle-date" class="form-control" value="${new Date().toISOString().split('T')[0]}" />
        </div>

        <button class="btn btn-primary btn-block" id="btn-submit-migration" style="padding: 14px; font-size: 16px; margin-top: 8px;">
          🚀 Hoàn Tất Sang Sổ & Bắt Đầu Quản Lý
        </button>
      </div>
    </div>
  `;

  // Render các dòng kỳ quá khứ
  function updatePastCyclesRows() {
    const count = Number(document.getElementById('mig-past-cycles-count')?.value) || 0;
    const containerEl = document.getElementById('mig-past-cycles-container');
    if (!containerEl) return;

    // Lấy danh sách thành viên đang được chọn
    const selectedMembers = getSelectedMembersList();

    let html = '';
    for (let i = 1; i <= count; i++) {
      html += `
        <div class="card" style="padding: 10px 12px; background: #ffffff; border: 1px solid #fecaca;">
          <div style="font-weight: 800; font-size: 13px; color: #991b1b; margin-bottom: 6px;">
            Kỳ ${i} (Đã khui):
          </div>
          <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px;">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" style="font-size:11.5px;">Người đã hốt kỳ ${i}:</label>
              <select class="form-control form-select mig-cycle-winner" data-cycle="${i}" style="font-size:12.5px;">
                <option value="">-- Chọn người đã hốt --</option>
                ${selectedMembers.map(m => `<option value="${m.id}">${escapeHtml(m.fullName)} (${escapeHtml(m.phone)})</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" style="font-size:11.5px;">Tiền thăm/lãi đã bỏ:</label>
              <input type="number" class="form-control mig-cycle-bid" data-cycle="${i}" placeholder="VD: 250000" step="10000" style="font-size:12.5px;" />
            </div>
          </div>
        </div>
      `;
    }
    containerEl.innerHTML = html;
  }

  function getSelectedMembersList() {
    const selected = [];
    container.querySelectorAll('.chk-mig-member:checked').forEach(chk => {
      const id = chk.getAttribute('data-id');
      const p = store.state.profiles.find(prof => prof.id === id);
      if (p) selected.push(p);
    });
    return selected;
  }

  // Khởi tạo dòng kỳ quá khứ
  updatePastCyclesRows();

  // Sự kiện thay đổi số kỳ quá khứ hoặc thay đổi thành viên
  document.getElementById('mig-past-cycles-count')?.addEventListener('change', () => {
    updatePastCyclesRows();
  });

  container.querySelectorAll('.chk-mig-member').forEach(chk => {
    chk.addEventListener('change', () => {
      updatePastCyclesRows();
    });
  });

  // Nút quay lại
  document.getElementById('btn-back-to-groups')?.addEventListener('click', () => {
    window.location.hash = '#groups';
  });

  // Nút thêm nhanh người vào danh bạ
  document.getElementById('btn-quick-add-member')?.addEventListener('click', () => {
    const name = prompt('Nhập họ tên hụi viên mới:');
    if (!name || !name.trim()) return;
    const phone = prompt('Nhập số điện thoại hụi viên:') || '090' + Math.floor(1000000 + Math.random() * 9000000);
    try {
      store.addMemberProfile({ fullName: name.trim(), phone: phone.trim() });
      showToast('Đã thêm hụi viên mới!', 'success');
      renderMigrateLedgerView(container);
    } catch (e) {
      showToast(e.message, 'danger');
    }
  });

  // Xử lý nộp form sang sổ
  document.getElementById('btn-submit-migration')?.addEventListener('click', () => {
    const name = document.getElementById('mig-group-name').value.trim();
    const baseAmount = Number(document.getElementById('mig-base-amount').value);
    const totalParts = Number(document.getElementById('mig-total-parts').value);
    const periodType = document.getElementById('mig-period-type').value;
    const commissionRate = Number(document.getElementById('mig-commission').value) || 50;
    const nextCycleDate = document.getElementById('mig-next-cycle-date').value;

    if (!name || !baseAmount || !totalParts) {
      showToast('Vui lòng điền đầy đủ tên dây, số tiền và tổng số phần hụi!', 'warning');
      return;
    }

    // Thu thập danh sách thành viên
    const membersData = [];
    container.querySelectorAll('.chk-mig-member:checked').forEach(chk => {
      const id = chk.getAttribute('data-id');
      const sharesInput = container.querySelector(`.mig-member-shares[data-id="${id}"]`);
      const shares = Number(sharesInput?.value) || 1;
      membersData.push({
        memberProfileId: id,
        sharesCount: shares
      });
    });

    if (membersData.length === 0) {
      showToast('Vui lòng chọn ít nhất một hụi viên trong danh sách!', 'warning');
      return;
    }

    // Thu thập các kỳ quá khứ
    const pastCyclesCount = Number(document.getElementById('mig-past-cycles-count').value) || 0;
    const pastCyclesData = [];

    for (let i = 1; i <= pastCyclesCount; i++) {
      const winnerSelect = container.querySelector(`.mig-cycle-winner[data-cycle="${i}"]`);
      const bidInput = container.querySelector(`.mig-cycle-bid[data-cycle="${i}"]`);
      const winnerId = winnerSelect?.value;
      const bidAmount = Number(bidInput?.value) || 0;

      const prof = store.state.profiles.find(p => p.id === winnerId);

      pastCyclesData.push({
        cycleNumber: i,
        winnerMemberProfileId: winnerId || null,
        winnerName: prof ? prof.fullName : 'Hụi viên',
        winningBidAmount: bidAmount,
        openDate: new Date().toISOString().split('T')[0]
      });
    }

    try {
      const newGrp = store.migrateExistingGroup(
        {
          name,
          baseAmount,
          totalParts,
          periodType,
          commissionRate,
          nextCycleDate
        },
        membersData,
        pastCyclesData
      );

      showToast(`Sang sổ thành công dây "${newGrp.name}"! Tiếp quản từ kỳ ${pastCyclesData.length + 1}.`, 'success');
      window.location.hash = `#group-detail/${newGrp.id}`;
    } catch (e) {
      showToast('Lỗi sang sổ: ' + e.message, 'danger');
    }
  });
}
