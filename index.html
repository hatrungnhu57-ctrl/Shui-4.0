  document.getElementById('btn-export-payments-excel')?.addEventListener('click', () => {
    const rows = [
      ['BẢNG KÊ THU TIỀN HỤI - KỲ ' + cycle.cycleNumber + ' - ' + group.name.toUpperCase()],
      ['Ngày khui:', formatDate(cycle.openDate), 'Người hốt:', winnerProfile?.fullName || 'Chưa có', 'Mức thăm:', formatMoney(cycle.winningBidAmount)],
      ['Tổng cần thu:', formatMoney(totalDue), 'Đã thu thực tế:', formatMoney(totalPaid), 'Còn thiếu:', formatMoney(remaining)],
      [''],
      ['STT', 'Họ và tên', 'Biệt danh', 'Diện hụi', 'Số phần', 'Số tiền phải nộp', 'Thực nộp', 'Hình thức', 'Trạng thái', 'Ghi chú']
    ];

    payments.forEach((p, idx) => {
      const prof = store.state.profiles.find(prof => prof.id === p.memberProfileId);
      rows.push([
        idx + 1,
        prof?.fullName || '',
        prof?.nickname || '',
        p.isDeadHui ? 'Hụi chết' : 'Hụi sống',
        p.sharesCount,
        formatMoney(p.amountDue),
        formatMoney(p.amountPaid),
        p.paymentMethod === 'transfer' ? 'Chuyển khoản' : 'Tiền mặt',
        p.status === 'paid' ? 'Đã nộp đủ' : (p.status === 'late' ? 'Trễ hạn' : 'Chưa nộp'),
        p.note || ''
      ]);
    });

    exportToCSV(`ThuTien_Ky${cycle.cycleNumber}_${group.name.replace(/\s+/g, '_')}.csv`, rows);
    showToast('Đã xuất file báo cáo thu tiền Excel!', 'success');
  });

  // Xem biên nhận
  const modalReceipt = document.getElementById('modal-receipt-view');
  container.querySelectorAll('.btn-view-receipt-payment').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const payId = e.currentTarget.getAttribute('data-pay-id');
      const rec = store.state.receipts.find(r => r.paymentId === payId);
      if (rec) {
        showReceiptModal(rec);
      } else {
        showToast('Không tìm thấy biên nhận tương ứng!', 'warning');
      }
    });
  });

  document.getElementById('btn-close-receipt-modal')?.addEventListener('click', () => modalReceipt.style.display = 'none');

  function showReceiptModal(rec) {
    const body = document.getElementById('receipt-modal-body');
    body.innerHTML = `
      <div class="receipt-paper" id="printable-receipt">
        <div style="text-align: center; border-bottom: 2px solid #0f172a; padding-bottom: 8px;">
          <h3 style="font-size: 16px; font-weight: 800; letter-spacing: 0.5px;">BIÊN NHẬN ĐÓNG TIỀN HỤI</h3>
          <div style="font-size: 11.5px; color: var(--text-muted);">Mã số phiếu: <strong>${rec.receiptNumber}</strong></div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; margin-top: 6px;">
          <div>👤 Người nộp tiền: <strong>${rec.payerName}</strong></div>
          <div>👩‍💼 Người thu tiền: <strong>${rec.receiverName}</strong> (Chủ hụi)</div>
          <div>📜 Dây hụi: <strong>${rec.huiName}</strong></div>
          <div>🎯 Kỳ đóng: <strong>Kỳ số ${rec.cycleNumber}</strong></div>
          <div>💳 Phương thức: <strong>${rec.paymentMethod}</strong></div>
          <div>📅 Ngày giờ lập: <strong>${rec.paymentDate}</strong></div>
          <div style="background: #f8fafc; padding: 8px; border-radius: 6px; margin-top: 4px; border: 1px solid #e2e8f0;">
            <div style="font-size: 12px; color: var(--text-muted);">Số tiền đã thu:</div>
            <div style="font-size: 18px; font-weight: 800; color: var(--primary);">${formatMoney(rec.amount)}</div>
            <div style="font-size: 11.5px; font-style: italic; color: #475569;">(Bằng chữ: ${rec.amountInWords})</div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 14px; font-size: 12px; text-align: center;">
          <div>
            <strong>Người nộp tiền</strong><br/>
            <span style="font-size: 10.5px; color: var(--text-muted);">(Ký, ghi rõ họ tên)</span>
            <div style="height: 40px;"></div>
            <span>${rec.payerName.split('(')[0]}</span>
          </div>
          <div>
            <strong>Người thu tiền (Chủ hụi)</strong><br/>
            <span style="font-size: 10.5px; color: var(--text-muted);">(Đã nhận đủ tiền)</span>
            <div style="height: 40px;"></div>
            <span>${rec.receiverName.split('(')[0]}</span>
          </div>
        </div>

        <div class="receipt-stamp">ĐÃ THU TIỀN</div>
      </div>
    `;
    modalReceipt.style.display = 'flex';

    document.getElementById('btn-print-receipt')?.addEventListener('click', () => {
      window.print();
    });

    document.getElementById('btn-share-receipt-zalo')?.addEventListener('click', () => {
      const shareText = `🧾 BIÊN NHẬN ĐÓNG TIỀN HỤI [${rec.receiptNumber}]\n- Người nộp: ${rec.payerName}\n- Dây hụi: ${rec.huiName} (Kỳ ${rec.cycleNumber})\n- Số tiền: ${formatMoney(rec.amount)} (${rec.amountInWords})\n- Phương thức: ${rec.paymentMethod}\n- Thời gian: ${rec.paymentDate}\n(Ứng dụng Quản lý Sổ Hụi)`;
      navigator.clipboard?.writeText(shareText);
      showToast('Đã sao chép nội dung biên nhận để gửi Zalo!', 'success');
    });
  }

  // Toàn cục để member view có thể gọi
  window.viewReceiptDetail = (recId) => {
    const rec = store.state.receipts.find(r => r.id === recId);
    if (rec) showReceiptModal(rec);
  };
}


/**
 * CẨM NANG CHƠI HỤI MIỀN NAM & NHẬT KÝ KIỂM TOÁN (GUIDE & ACTIVITY LOGS)
 */




function renderGuideView(container) {
  let activeCategory = 'all';

  function renderHTML() {
    const filteredArticles = activeCategory === 'all'
      ? GUIDE_ARTICLES
      : GUIDE_ARTICLES.filter(a => a.category === activeCategory);

    container.innerHTML = `
      <div>
        <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">📚 Cẩm Nang Chơi Hụi Toàn Tập</h2>
        <div style="font-size: 12.5px; color: var(--text-muted);">
          Kiến thức, quy tắc tính tiền, pháp lý & phòng chống rủi ro chuẩn miền Nam
        </div>
      </div>

      <!-- Bộ lọc danh mục -->
      <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;">
        <button class="btn btn-sm btn-guide-cat ${activeCategory === 'all' ? 'btn-primary' : 'btn-outline'}" data-cat="all">
          Tất cả (13)
        </button>
        <button class="btn btn-sm btn-guide-cat ${activeCategory === 'knowledge' ? 'btn-primary' : 'btn-outline'}" data-cat="knowledge">
          📖 Thuật ngữ & Cách tính
        </button>
        <button class="btn btn-sm btn-guide-cat ${activeCategory === 'safety' ? 'btn-primary' : 'btn-outline'}" data-cat="safety">
          🛡️ Phòng ngừa rủi ro
        </button>
        <button class="btn btn-sm btn-guide-cat ${activeCategory === 'law' ? 'btn-primary' : 'btn-outline'}" data-cat="law">
          ⚖️ Pháp lý & Bằng chứng
        </button>
        <button class="btn btn-sm btn-guide-cat ${activeCategory === 'template' ? 'btn-primary' : 'btn-outline'}" data-cat="template">
          📝 Mẫu thỏa thuận
        </button>
      </div>

      <!-- Danh sách bài viết cẩm nang (Accordion) -->
      <div class="item-list">
        ${filteredArticles.map(art => `
          <div class="card guide-card" data-id="${art.id}" style="cursor: pointer;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <h3 style="font-size: 14.5px; font-weight: 700; color: var(--text-main); flex: 1;">
                ${art.title}
              </h3>
              <span class="guide-toggle-icon" style="font-size: 14px; color: var(--text-muted); margin-left: 8px;">▼</span>
            </div>
            <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 2px;">
              ${art.summary}
            </p>
            <div class="guide-content" id="content-${art.id}" style="display: none; font-size: 13.5px; line-height: 1.6; border-top: 1px dashed var(--border-color); padding-top: 10px; margin-top: 6px; color: #334155;">
              ${art.content}
            </div>
          </div>
        `).join('')}
      </div>
    `;

    // Gán sự kiện mở rộng bài viết
    container.querySelectorAll('.guide-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.getAttribute('data-id');
        const content = document.getElementById(`content-${id}`);
        const icon = card.querySelector('.guide-toggle-icon');
        if (content) {
          const isOpen = content.style.display === 'block';
          content.style.display = isOpen ? 'none' : 'block';
          if (icon) icon.innerText = isOpen ? '▼' : '▲';
        }
      });
    });

    // Gán sự kiện lọc
    container.querySelectorAll('.btn-guide-cat').forEach(btn => {
      btn.addEventListener('click', (e) => {
        activeCategory = e.currentTarget.getAttribute('data-cat');
        renderHTML();
      });
    });
  }

  renderHTML();
}

function renderLogsView(container) {
  const logs = store.state.logs;

  container.innerHTML = `
    <div>
      <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">📜 Nhật Ký Hoạt Động & Kiểm Toán</h2>
      <div style="font-size: 12.5px; color: var(--text-muted);">
        Lưu vết toàn bộ thao tác thêm, sửa, đổi tiền, khui hụi & quay số minh bạch
      </div>
    </div>

    <div class="card">
      <div class="item-list">
        ${logs.map(log => {
          let badgeClass = 'badge-info';
          if (log.action === 'CREATE_HUI') badgeClass = 'badge-success';
          if (log.action === 'OPEN_CYCLE') badgeClass = 'badge-warning';
          if (log.action === 'RECORD_PAYMENT') badgeClass = 'badge-primary';
          if (log.action === 'MERGE_PROFILE') badgeClass = 'badge-danger';

          return `
            <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="badge ${badgeClass}">${log.action}</span>
                <span style="font-size: 11px; color: var(--text-muted);">🕒 ${log.timestamp}</span>
              </div>
              <div style="font-size: 13px; color: var(--text-main); font-weight: 600; margin-top: 2px;">
                ${log.description}
              </div>
              <div style="font-size: 11.5px; color: var(--text-muted);">
                Người thực hiện: <strong>${log.actorName}</strong> (Đối tượng: ${log.targetType})
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}


/**
 * SỔ HỤI - BỘ ĐIỀU HƯỚNG & KHỞI CHẠY ỨNG DỤNG (MAIN APP CONTROLLER)
 */













class SoHuiApp {
  constructor() {
    this.appContainer = document.getElementById('app-container');
    this.init();
  }

  init() {
    // Lắng nghe thay đổi URL Hash
    window.addEventListener('hashchange', () => this.handleRoute());

    // Đăng ký nhận thông báo thay đổi State
    store.subscribe(() => {
      this.updateHeader();
    });

    // Tạo Header, Main Content, Bottom Nav
    this.renderLayout();

    // Điều hướng ban đầu
    if (!window.location.hash) {
      window.location.hash = '#select-role';
    } else {
      this.handleRoute();
    }
  }

  renderLayout() {
    this.appContainer.innerHTML = `
      <!-- Header -->
      <header class="app-header" id="main-header">
        <div class="brand-badge" id="btn-home-logo" style="cursor: pointer;">
          <div class="brand-icon">📜</div>
          <span>SỔ HỤI</span>
        </div>
        <div id="header-right" style="display: flex; align-items: center; gap: 8px;">
          <!-- Vai trò hiện tại -->
        </div>
      </header>

      <!-- Main Content -->
      <main class="app-main" id="main-content"></main>

      <!-- Bottom Nav Bar -->
      <nav class="app-nav" id="main-nav">
        <button class="nav-item" data-route="#dashboard">
          <span class="icon">🏠</span>
          <span>Tổng quan</span>
        </button>
        <button class="nav-item" data-route="#groups">
          <span class="icon">📋</span>
          <span>Dây hụi</span>
        </button>
        <button class="nav-item" data-route="#members">
          <span class="icon">👥</span>
          <span>Danh bạ</span>
        </button>
        <button class="nav-item" data-route="#guide">
          <span class="icon">📚</span>
          <span>Cẩm nang</span>
        </button>
        <button class="nav-item" data-route="#logs">
          <span class="icon">📜</span>
          <span>Nhật ký</span>
        </button>
      </nav>

      <!-- Modal Phản Hồi của Hụi Viên -->
      <div id="modal-feedback" class="modal-overlay" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title">Gửi Phản Hồi Cho Chủ Hụi</h3>
            <button class="btn btn-sm btn-outline btn-circle" id="btn-close-fb-modal">✕</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label">Loại phản hồi:</label>
              <select id="fb-type" class="form-control form-select">
                <option value="amount">Báo sai lệch số tiền cần đóng</option>
                <option value="receipt">Chưa nhận được biên nhận / hình ảnh</option>
                <option value="schedule">Xin gia hạn thời gian nộp tiền</option>
                <option value="other">Góp ý / Yêu cầu khác</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Nội dung chi tiết:</label>
              <textarea id="fb-content" class="form-control" rows="3" placeholder="Nhập nội dung cần trao đổi với chủ hụi..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" id="btn-cancel-fb" style="flex:1;">Hủy</button>
            <button class="btn btn-primary" id="btn-send-fb" style="flex:2;">📨 Gửi Phản Hồi</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btn-home-logo')?.addEventListener('click', () => {
      window.location.hash = '#dashboard';
    });

    // Gán sự kiện click cho Bottom Nav
    this.appContainer.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const route = btn.getAttribute('data-route');
        window.location.hash = route;
      });
    });

    // Xử lý modal feedback
    const modalFb = document.getElementById('modal-feedback');
    document.getElementById('btn-close-fb-modal')?.addEventListener('click', () => modalFb.style.display = 'none');
    document.getElementById('btn-cancel-fb')?.addEventListener('click', () => modalFb.style.display = 'none');
    document.getElementById('btn-send-fb')?.addEventListener('click', () => {
      const type = document.getElementById('fb-type').value;
      const content = document.getElementById('fb-content').value.trim();
      if (!content) {
        showToast('Vui lòng nhập nội dung phản hồi!', 'warning');
        return;
      }

      store.logAction('RECORD_PAYMENT', 'Payment', 'feedback', `Hụi viên gửi phản hồi (${type}): ${content}`);
      showToast('Đã gửi phản hồi đến Chủ Hụi thành công!', 'success');
      modalFb.style.display = 'none';
      document.getElementById('fb-content').value = '';
    });

    window.showFeedbackModal = (huiName, cycleNum) => {
      modalFb.style.display = 'flex';
      const typeSelect = document.getElementById('fb-type');
      if (huiName && huiName !== 'Chung') {
        document.getElementById('fb-content').value = `Tôi xin phản hồi về dây [${huiName}] kỳ ${cycleNum}: `;
      }
    };

    this.updateHeader();
  }

  updateHeader() {
    const headerRight = document.getElementById('header-right');
    if (!headerRight) return;

    const role = store.state.currentRole;
    let roleText = 'Chủ Hụi';
    let roleClass = 'owner';
    let roleIcon = '👩‍💼';

    if (role === 'member') {
      roleText = 'Hụi Viên';
      roleClass = 'member';
      roleIcon = '👨‍🌾';
    } else if (role === 'hybrid') {
      roleText = 'Chủ & Hụi Viên';
      roleClass = 'hybrid';
      roleIcon = '🧕';
    }

    headerRight.innerHTML = `
      <div class="role-tag ${roleClass}" id="btn-change-role" title="Bấm để đổi vai trò">
        <span>${roleIcon}</span>
        <span>${roleText}</span>
        <span style="font-size: 10px; opacity: 0.7;">▼</span>
      </div>
      <button class="btn btn-sm btn-outline btn-circle" id="btn-reset-demo" title="Khôi phục dữ liệu mẫu">
        🔄
      </button>
    `;

    document.getElementById('btn-change-role')?.addEventListener('click', () => {
      window.location.hash = '#select-role';
    });

    document.getElementById('btn-reset-demo')?.addEventListener('click', () => {
      if (confirm('Bạn có muốn khôi phục lại toàn bộ dữ liệu mẫu ban đầu của Sổ Hụi không?')) {
        store.resetToDemoData();
        showToast('Đã khôi phục dữ liệu mẫu thành công!', 'info');
        window.location.hash = '#dashboard';
      }
    });
  }

  handleRoute() {
    const hash = window.location.hash || '#select-role';
    const mainContent = document.getElementById('main-content');
    const navBar = document.getElementById('main-nav');
    const header = document.getElementById('main-header');

    if (!mainContent) return;

    // Cập nhật trạng thái Active trên Nav
    this.appContainer.querySelectorAll('.nav-item').forEach(item => {
      const r = item.getAttribute('data-route');
      if (hash.startsWith(r)) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });

    // 1. Màn hình chọn vai trò
    if (hash === '#select-role') {
      if (navBar) navBar.style.display = 'none';
      if (header) header.style.display = 'none';
      renderRoleSelector(mainContent);
      return;
    }

    if (navBar) navBar.style.display = 'grid';
    if (header) header.style.display = 'flex';

    // 2. Dashboard theo vai trò
    if (hash === '#dashboard') {
      if (store.state.currentRole === 'owner') {
        renderOwnerDashboard(mainContent);
      } else if (store.state.currentRole === 'member') {
        renderMemberDashboard(mainContent);
      } else {
        // Hybrid: Render cả hai tab
        this.renderHybridDashboard(mainContent);
      }
      return;
    }

    // 3. Danh bạ hụi viên
    if (hash === '#members') {
      renderMembersDirectory(mainContent);
      return;
    }

    // 4. Tạo dây hụi mới
    if (hash === '#create-group') {
      renderCreateGroup(mainContent);
      return;
    }

    // 5. Danh sách dây hụi
    if (hash === '#groups') {
      if (store.state.currentRole === 'member') {
        renderMemberDashboard(mainContent);
      } else {
        renderOwnerDashboard(mainContent);
      }
      return;
    }

    // 6. Chi tiết dây hụi (#group-detail/:groupId)
    if (hash.startsWith('#group-detail/')) {
      const groupId = hash.split('/')[1];
      renderGroupDetail(mainContent, groupId);
      return;
    }

    // 7. Khui hụi & Quay random (#draw/:groupId/:cycleId)
    if (hash.startsWith('#draw/')) {
      const parts = hash.split('/');
      const groupId = parts[1];
      const cycleId = parts[2];
      renderDrawScreen(mainContent, groupId, cycleId);
      return;
    }

    // 8. Bảng đóng tiền kỳ (#cycle-payments/:cycleId)
    if (hash.startsWith('#cycle-payments/')) {
      const cycleId = hash.split('/')[1];
      renderCyclePayments(mainContent, cycleId);
      return;
    }

    // 9. Cẩm nang
    if (hash === '#guide') {
      renderGuideView(mainContent);
      return;
    }

    // 10. Nhật ký hoạt động
    if (hash === '#logs') {
      renderLogsView(mainContent);
      return;
    }

    // Mặc định fallback
    renderOwnerDashboard(mainContent);
  }

  renderHybridDashboard(container) {
    container.innerHTML = `
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button class="btn btn-sm btn-primary" id="btn-tab-hybrid-owner" style="flex: 1;">
          👩‍💼 Dây Tôi Làm Chủ (${store.state.groups.length})
        </button>
        <button class="btn btn-sm btn-outline" id="btn-tab-hybrid-member" style="flex: 1;">
          👨‍🌾 Chân Hụi Tôi Chơi
        </button>
      </div>
      <div id="hybrid-content-container"></div>
    `;

    const subContainer = document.getElementById('hybrid-content-container');
    renderOwnerDashboard(subContainer);

    document.getElementById('btn-tab-hybrid-owner')?.addEventListener('click', (e) => {
      e.currentTarget.className = 'btn btn-sm btn-primary';
      document.getElementById('btn-tab-hybrid-member').className = 'btn btn-sm btn-outline';
      renderOwnerDashboard(subContainer);
    });

    document.getElementById('btn-tab-hybrid-member')?.addEventListener('click', (e) => {
      e.currentTarget.className = 'btn btn-sm btn-primary';
      document.getElementById('btn-tab-hybrid-owner').className = 'btn btn-sm btn-outline';
      renderMemberDashboard(subContainer);
    });
  }
}

// Khởi chạy khi DOM sẵn sàng
document.addEventListener('DOMContentLoaded', () => {
  window.app = new SoHuiApp();
});

  </script>
</body>
