            <div style="display: flex; align-items: center; gap: 8px;">
              <h4 style="font-size: 15.5px; font-weight: 700; color: var(--text-main);">${p.fullName}</h4>
              ${p.nickname ? `<span style="font-size: 13px; color: var(--primary); font-weight: 600;">(${p.nickname})</span>` : ''}
            </div>
            <div style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">
              📞 <strong>${p.phone}</strong> • 📍 ${p.address || 'Chưa có địa chỉ'}
            </div>
          </div>
          <div>${getCreditBadge(p.creditRating)}</div>
        </div>

        <!-- Thống kê hụi của thành viên này -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #f8fafc; padding: 8px; border-radius: 8px; font-size: 12px; text-align: center;">
          <div>
            <span style="color: var(--text-muted);">Đang chơi:</span>
            <div style="font-weight: 700; color: var(--primary);">${p.activeHuiCount || 0} dây</div>
          </div>
          <div>
            <span style="color: var(--text-muted);">Đã hốt:</span>
            <div style="font-weight: 700; color: #b45309;">${p.hotedCount || 0} lần</div>
          </div>
          <div>
            <span style="color: var(--text-muted);">Trễ hạn:</span>
            <div style="font-weight: 700; color: ${p.latePaymentCount > 0 ? 'var(--accent)' : 'var(--text-main)'};">${p.latePaymentCount || 0} lần</div>
          </div>
        </div>

        ${p.riskNote ? `
          <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #991b1b;">
            <strong>⚠️ Lưu ý rủi ro:</strong> ${p.riskNote}
          </div>
        ` : ''}

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
          <button class="btn btn-sm btn-outline btn-edit-profile" data-id="${p.id}">
            ✏️ Sửa
          </button>
          <button class="btn btn-sm btn-outline btn-merge-profile" data-id="${p.id}">
            🔗 Gộp hồ sơ
          </button>
        </div>
      </div>
    `).join('');
  }

  // Tìm kiếm tức thì
  const searchInput = document.getElementById('member-search-input');
  searchInput?.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = profiles.filter(p =>
      p.fullName.toLowerCase().includes(q) ||
      (p.nickname && p.nickname.toLowerCase().includes(q)) ||
      p.phone.includes(q)
    );
    const listContainer = document.getElementById('member-list-container');
    if (listContainer) listContainer.innerHTML = renderMemberListHTML(filtered);
    attachListButtons();
  });

  // Sự kiện mở modal thêm mới
  const modalMember = document.getElementById('modal-member-form');
  document.getElementById('btn-open-add-member')?.addEventListener('click', () => {
    document.getElementById('modal-member-title').innerText = 'Thêm Hụi Viên Mới Vào Danh Bạ';
    document.getElementById('form-member-id').value = '';
    document.getElementById('form-member-fullname').value = '';
    document.getElementById('form-member-nickname').value = '';
    document.getElementById('form-member-phone').value = '';
    document.getElementById('form-member-address').value = '';
    document.getElementById('form-member-rating').value = '5';
    document.getElementById('form-member-risknote').value = '';
    document.getElementById('form-member-notes').value = '';
    modalMember.style.display = 'flex';
  });

  document.getElementById('btn-close-member-modal')?.addEventListener('click', () => modalMember.style.display = 'none');
  document.getElementById('btn-cancel-member-form')?.addEventListener('click', () => modalMember.style.display = 'none');

  // Lưu hồ sơ
  document.getElementById('btn-save-member-form')?.addEventListener('click', () => {
    const id = document.getElementById('form-member-id').value;
    const fullName = document.getElementById('form-member-fullname').value.trim();
    const nickname = document.getElementById('form-member-nickname').value.trim();
    const phone = document.getElementById('form-member-phone').value.trim();
    const address = document.getElementById('form-member-address').value.trim();
    const creditRating = document.getElementById('form-member-rating').value;
    const riskNote = document.getElementById('form-member-risknote').value.trim();
    const notes = document.getElementById('form-member-notes').value.trim();

    if (!fullName || !phone) {
      showToast('Vui lòng nhập họ tên và số điện thoại!', 'warning');
      return;
    }

    try {
      if (id) {
        store.updateMemberProfile(id, { fullName, nickname, phone, address, creditRating, riskNote, notes });
        showToast('Cập nhật thông tin hụi viên thành công!', 'success');
      } else {
        store.addMemberProfile({ fullName, nickname, phone, address, creditRating, riskNote, notes });
        showToast('Đã thêm hụi viên mới vào danh bạ!', 'success');
      }
      modalMember.style.display = 'none';
      renderMembersDirectory(container);
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  // Modal Gộp hồ sơ
  const modalMerge = document.getElementById('modal-merge-profiles');
  document.getElementById('btn-close-merge-modal')?.addEventListener('click', () => modalMerge.style.display = 'none');
  document.getElementById('btn-cancel-merge')?.addEventListener('click', () => modalMerge.style.display = 'none');

  document.getElementById('btn-confirm-merge')?.addEventListener('click', () => {
    const primaryId = document.getElementById('select-primary-profile').value;
    const duplicateId = document.getElementById('select-duplicate-profile').value;

    if (primaryId === duplicateId) {
      showToast('Vui lòng chọn 2 hồ sơ khác nhau để gộp!', 'warning');
      return;
    }

    if (confirm('Bạn có chắc chắn muốn gộp toàn bộ lịch sử của hồ sơ phụ vào hồ sơ gốc không? Thao tác này sẽ lưu vết kiểm toán vĩnh viễn.')) {
      try {
        store.mergeProfiles(primaryId, duplicateId);
        showToast('Đã gộp hồ sơ hụi viên thành công!', 'success');
        modalMerge.style.display = 'none';
        renderMembersDirectory(container);
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  });

  function attachListButtons() {
    container.querySelectorAll('.btn-edit-profile').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.currentTarget.getAttribute('data-id');
        const p = store.state.profiles.find(prof => prof.id === id);
        if (p) {
          document.getElementById('modal-member-title').innerText = 'Chỉnh Sửa Hồ Sơ Hụi Viên';
          document.getElementById('form-member-id').value = p.id;
          document.getElementById('form-member-fullname').value = p.fullName;
          document.getElementById('form-member-nickname').value = p.nickname || '';
          document.getElementById('form-member-phone').value = p.phone;
          document.getElementById('form-member-address').value = p.address || '';
          document.getElementById('form-member-rating').value = p.creditRating || 5;
          document.getElementById('form-member-risknote').value = p.riskNote || '';
          document.getElementById('form-member-notes').value = p.notes || '';
          modalMember.style.display = 'flex';
        }
      });
    });

    container.querySelectorAll('.btn-merge-profile').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.currentTarget.getAttribute('data-id');
        document.getElementById('select-primary-profile').value = id;
        modalMerge.style.display = 'flex';
      });
    });
  }

  attachListButtons();
}


/**
 * TẠO DÂY HỤI MỚI & THÊM HỤI VIÊN TỪ DANH BẠ
 * Chọn nhiều hụi viên, nhập số chân tham gia, cảnh báo tự động người có nợ/trễ hạn
 */




function renderCreateGroup(container) {
  const profiles = store.state.profiles.filter(p => !p.isMerged);

  container.innerHTML = `
    <div>
      <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">➕ Tạo Dây Hụi Mới</h2>
      <div style="font-size: 12.5px; color: var(--text-muted);">
        Điền thông tin thỏa thuận và chọn hụi viên trực tiếp từ danh bạ
      </div>
    </div>

    <div class="card">
      <div class="card-title">1. Thông tin quy cách dây hụi</div>

      <div class="form-group">
        <label class="form-label">Tên dây hụi (*):</label>
        <input type="text" id="create-group-name" class="form-control" placeholder="VD: Dây 2 Triệu Chợ Chiều, Dây Tháng 5 Triệu" required />
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div class="form-group">
          <label class="form-label">Mức góp / phần (*):</label>
          <input type="number" id="create-group-amount" class="form-control" placeholder="2000000" step="100000" required />
        </div>
        <div class="form-group">
          <label class="form-label">Tổng số phần hụi (*):</label>
          <input type="number" id="create-group-parts" class="form-control" value="12" min="2" max="60" required />
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div class="form-group">
          <label class="form-label">Chu kỳ khui:</label>
          <select id="create-group-period" class="form-control form-select">
            <option value="month" selected>Hàng tháng (Tháng/kỳ)</option>
            <option value="half_month">Nửa tháng (15 ngày/kỳ)</option>
            <option value="week">Hàng tuần (Tuần/kỳ)</option>
            <option value="day">Theo ngày (Hụi ngày)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Ngày bắt đầu khơi:</label>
          <input type="date" id="create-group-startdate" class="form-control" value="${new Date().toISOString().split('T')[0]}" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Quy định ngày khui định kỳ:</label>
        <input type="text" id="create-group-rule" class="form-control" placeholder="VD: Mùng 15 Tây hàng tháng, Chiều Thứ 7 hàng tuần lúc 16:00" />
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div class="form-group">
          <label class="form-label">Hình thức khui hụi:</label>
          <select id="create-group-method" class="form-control form-select">
            <option value="bidding" selected>🏷️ Kêu hụi / Bỏ lãi (Đấu giá)</option>
            <option value="secret_ballot">🗳️ Bỏ thăm kín</option>
            <option value="random">🎲 Quay Random ngẫu nhiên</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tiền thảo chủ hụi (%):</label>
          <input type="number" id="create-group-commission" class="form-control" value="50" placeholder="50 (% của 1 phần góp)" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Ghi chú & Luật thỏa thuận riêng:</label>
        <textarea id="create-group-notes" class="form-control" rows="2" placeholder="VD: Hụi viên đóng trong 24h; người hốt chịu tiền thảo; trễ hạn chịu phạt..."></textarea>
      </div>
    </div>

    <!-- PHẦN 2: CHỌN HỤI VIÊN TỪ DANH BẠ -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">2. Chọn Hụi Viên & Số phần tham gia</div>
        <span class="badge badge-info" id="badge-parts-counter">Đã chọn: 0 / 12 phần</span>
      </div>

      <p style="font-size: 12.5px; color: var(--text-muted);">
        Chọn thành viên từ danh bạ dùng chung. Hệ thống sẽ tự động hiển thị <strong>cảnh báo đỏ</strong> nếu thành viên đó từng trễ hạn hoặc đang có nợ ở dây khác.
      </p>

      <div class="item-list" style="max-height: 400px; overflow-y: auto;">
        ${profiles.map(p => {
          const hasRisk = p.latePaymentCount > 0 || p.riskNote.length > 0 || p.creditRating <= 2;
          return `
            <div class="card member-select-row" data-id="${p.id}" style="padding: 10px; margin: 0; background: ${hasRisk ? '#fffaf0' : '#ffffff'}; border-color: ${hasRisk ? '#fed7aa' : 'var(--border-color)'};">
              <div style="display: flex; align-items: center; justify-content: space-between;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1;">
                  <input type="checkbox" class="cb-member-select" value="${p.id}" style="width: 18px; height: 18px; accent-color: var(--primary);" />
                  <div>
                    <strong style="font-size: 14px; color: var(--text-main);">${p.fullName}</strong>
                    ${p.nickname ? `<span style="font-size: 12.5px; color: var(--primary); font-weight: 600;">(${p.nickname})</span>` : ''}
                    <div style="font-size: 11.5px; color: var(--text-muted);">📞 ${p.phone}</div>
                  </div>
                </label>

                <!-- Nhập số phần tham gia -->
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span style="font-size: 12px; color: var(--text-muted);">Số phần:</span>
                  <input type="number" class="form-control input-shares-count" data-id="${p.id}" value="1" min="1" max="10" style="width: 55px; padding: 4px 6px; text-align: center;" disabled />
                </div>
              </div>

              <!-- Cảnh báo rủi ro nếu có -->
              ${hasRisk ? `
                <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 4px; padding: 4px 8px; font-size: 11.5px; color: #991b1b; margin-top: 6px;">
                  🚨 <strong>CẢNH BÁO:</strong> Từng trễ hạn ${p.latePaymentCount} lần. ${p.riskNote || ''}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <!-- Tóm tắt & Nút bấm -->
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-outline" id="btn-cancel-create" style="flex: 1;">Hủy bỏ</button>
      <button class="btn btn-primary" id="btn-submit-create-group" style="flex: 2;">🚀 Khởi Tạo Dây Hụi</button>
    </div>
  `;

  // Cập nhật số phần khi click checkbox hoặc thay đổi số phần
  const totalPartsInput = document.getElementById('create-group-parts');
  const counterBadge = document.getElementById('badge-parts-counter');

  function updateCounter() {
    const targetTotal = Number(totalPartsInput.value) || 0;
    let selectedParts = 0;

    container.querySelectorAll('.cb-member-select:checked').forEach(cb => {
      const id = cb.value;
      const sharesInput = container.querySelector(`.input-shares-count[data-id="${id}"]`);
      if (sharesInput) {
        selectedParts += Number(sharesInput.value) || 1;
      }
    });

    counterBadge.innerText = `Đã chọn: ${selectedParts} / ${targetTotal} phần`;
    if (selectedParts === targetTotal) {
      counterBadge.className = 'badge badge-success';
    } else if (selectedParts > targetTotal) {
      counterBadge.className = 'badge badge-danger';
      counterBadge.innerText += ' (Quá số phần!)';
    } else {
      counterBadge.className = 'badge badge-warning';
    }
  }

  totalPartsInput.addEventListener('input', updateCounter);

  container.querySelectorAll('.cb-member-select').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const id = e.target.value;
      const sharesInput = container.querySelector(`.input-shares-count[data-id="${id}"]`);
      if (sharesInput) {
        sharesInput.disabled = !e.target.checked;
      }
      updateCounter();
    });
  });

  container.querySelectorAll('.input-shares-count').forEach(input => {
    input.addEventListener('input', updateCounter);
  });

  // Hủy
  document.getElementById('btn-cancel-create')?.addEventListener('click', () => {
    window.location.hash = '#dashboard';
  });

  // Gửi tạo dây hụi
  document.getElementById('btn-submit-create-group')?.addEventListener('click', () => {
    const name = document.getElementById('create-group-name').value.trim();
    const baseAmount = Number(document.getElementById('create-group-amount').value);
    const totalParts = Number(document.getElementById('create-group-parts').value);
    const periodType = document.getElementById('create-group-period').value;
    const startDate = document.getElementById('create-group-startdate').value;
    const openDayRule = document.getElementById('create-group-rule').value.trim();
    const drawMethod = document.getElementById('create-group-method').value;
    const commissionRate = Number(document.getElementById('create-group-commission').value) || 0;
    const agreementNotes = document.getElementById('create-group-notes').value.trim();

    if (!name || !baseAmount || !totalParts) {
      showToast('Vui lòng điền đầy đủ Tên dây, Mức góp và Tổng số phần!', 'warning');
      return;
    }

    // Lấy danh sách thành viên đã chọn
    const selectedMembers = [];
    let selectedTotalParts = 0;
    let hasRiskMembers = [];

    container.querySelectorAll('.cb-member-select:checked').forEach(cb => {
      const pid = cb.value;
      const sharesInput = container.querySelector(`.input-shares-count[data-id="${pid}"]`);
      const count = Number(sharesInput.value) || 1;
      selectedTotalParts += count;

      const prof = profiles.find(p => p.id === pid);
      if (prof && (prof.latePaymentCount > 0 || prof.riskNote.length > 0)) {
        hasRiskMembers.push(prof.fullName);
      }

      selectedMembers.push({
        memberProfileId: pid,
        sharesCount: count
      });
    });

    if (selectedMembers.length === 0) {
      showToast('Vui lòng chọn ít nhất một hụi viên tham gia!', 'warning');
      return;
    }

    if (selectedTotalParts !== totalParts) {
      if (!confirm(`Tổng số phần đã chọn (${selectedTotalParts}) chưa khớp với quy cách dây hụi (${totalParts} phần). Bạn có chắc chắn muốn tiếp tục không?`)) {
        return;
      }
    }

    if (hasRiskMembers.length > 0) {
      if (!confirm(`⚠️ CẢNH BÁO RỦI RO:\nTrong danh sách chọn có thành viên từng trễ hạn / có nợ:\n- ${hasRiskMembers.join('\n- ')}\n\nBạn có chắc chắn muốn thêm những người này vào dây mới không?`)) {
        return;
      }
    }

    try {
      const newGroup = store.createHuiGroup({
        name,
        baseAmount,
        totalParts,
        periodType,
        startDate,
        openDayRule,
        drawMethod,
        commissionRate,
        agreementNotes
      }, selectedMembers);

      showToast(`Tạo thành công dây hụi "${newGroup.name}"!`, 'success');
      window.location.hash = `#group-detail/${newGroup.id}`;
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  updateCounter();
}


/**
 * CHI TIẾT DÂY HỤI & QUẢN LÝ CÁC KỲ HỤI (GROUP DETAIL & CYCLES)
 */




function renderGroupDetail(container, groupId) {
  const group = store.state.groups.find(g => g.id === groupId);
  if (!group) {
    container.innerHTML = `
      <div class="card" style="text-align: center; padding: 30px;">
        <h3>Không tìm thấy dây hụi!</h3>
        <button class="btn btn-primary" onclick="window.location.hash='#groups'">Quay lại danh sách</button>
      </div>
    `;
    return;
  }

  const groupMembers = store.state.groupMembers.filter(gm => gm.groupId === group.id);
  const cycles = store.state.cycles.filter(c => c.groupId === group.id).sort((a, b) => a.cycleNumber - b.cycleNumber);
  const closedCycles = cycles.filter(c => c.status === 'closed');
  const currentCycle = cycles.find(c => c.status === 'open') || cycles[cycles.length - 1];

  container.innerHTML = `
    <!-- Tiêu đề & Thông tin cơ bản -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <button class="btn btn-sm btn-outline" style="margin-bottom: 6px;" onclick="window.location.hash='#groups'">
          ← Danh sách dây
        </button>
        <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">${group.name}</h2>
        <div style="font-size: 12.5px; color: var(--text-muted);">
          Bắt đầu: ${formatDate(group.startDate)} • Quy định: ${group.openDayRule}
        </div>
      </div>
      <span class="badge ${group.status === 'active' ? 'badge-success' : 'badge-gray'}">
        ${group.status === 'active' ? 'Đang hoạt động' : 'Đã mãn dây'}
      </span>
    </div>

    <!-- Card Tổng Quan Thông Số -->
    <div class="card highlight">
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 13px;">
        <div>💵 Mức góp: <strong>${formatMoney(group.baseAmount)}</strong>/phần</div>
        <div>🔢 Quy mô: <strong>${group.totalParts} phần</strong> (${cycles.length} kỳ)</div>
        <div>⏱️ Chu kỳ: <strong>${getPeriodLabel(group.periodType)}</strong></div>
        <div>🎲 Hình thức: <strong>${getDrawMethodLabel(group.drawMethod)}</strong></div>
      </div>

      <div style="padding-top: 8px; border-top: 1px dashed var(--border-color);">
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;">
          <span>Tiến độ dây hụi:</span>
          <strong>${closedCycles.length} / ${group.totalParts} kỳ (${Math.round((closedCycles.length / group.totalParts) * 100)}%)</strong>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(closedCycles.length / group.totalParts) * 100}%;"></div>
        </div>
      </div>

      ${group.agreementNotes ? `
        <div style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 12px; color: var(--text-muted); margin-top: 4px;">
          <strong>📜 Thỏa thuận riêng:</strong> ${group.agreementNotes}
        </div>
      ` : ''}

      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button class="btn btn-sm btn-outline" id="btn-export-group-excel" style="flex: 1;">
          📊 Xuất Bảng Kê Excel
        </button>
      </div>
    </div>

    <!-- Kỳ Hiện Tại Đang Khui / Thu Tiền -->
    ${currentCycle ? `
      <div class="card" style="border: 2px solid ${currentCycle.status === 'open' ? 'var(--primary)' : 'var(--border-color)'};">
        <div class="card-header">
          <div class="card-title">
            🎯 Kỳ số ${currentCycle.cycleNumber} (Kỳ hiện tại)
          </div>
          <span class="badge ${currentCycle.status === 'open' ? 'badge-warning' : 'badge-success'}">
            ${currentCycle.status === 'open' ? 'Đang mở' : 'Đã chốt sổ'}
          </span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px;">
          <div>📅 Ngày mở: <strong>${formatDate(currentCycle.openDate)}</strong></div>
          ${currentCycle.winnerMemberProfileId ? `
            <div style="background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 10px; color: #065f46;">
              🎉 <strong>Người hốt kỳ này:</strong> ${getMemberFullName(currentCycle.winnerMemberProfileId)}<br/>
              💰 <strong>Mức tiền thăm trúng:</strong> ${formatMoney(currentCycle.winningBidAmount)}<br/>
              💵 <strong>Tổng tiền người hốt thực nhận:</strong> ${formatMoney(currentCycle.potAmount)}<br/>
              🏷️ <strong>Tiền thảo chủ hụi:</strong> ${formatMoney(currentCycle.commissionAmount)}
            </div>

            <!-- Bảng thu chi kỳ này -->
            <div style="display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 4px;">
              <span>Đã thu: <strong style="color: var(--primary);">${formatMoney(currentCycle.totalCollected)}</strong></span>
              <span>Cần thu: <strong>${formatMoney(currentCycle.totalExpected)}</strong></span>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 6px;">
              <button class="btn btn-primary btn-sm btn-block" onclick="window.location.hash='#cycle-payments/${currentCycle.id}'">
                💳 Danh Sách Đóng Tiền & Biên Nhận
              </button>
            </div>
          ` : `
            <div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 8px; color: #92400e; font-size: 12.5px;">
              ⚠️ Kỳ này chưa tiến hành khui hụi để xác định người hốt.
            </div>
            <button class="btn btn-primary btn-block" style="margin-top: 6px;" onclick="window.location.hash='#draw/${group.id}/${currentCycle.id}'">
              🎲 Tiến Hành Khui Hụi Kỳ ${currentCycle.cycleNumber}
            </button>
          `}
        </div>
      </div>
    ` : ''}

    <!-- Danh sách các hụi viên trong dây -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          👥 Danh sách Chân Hụi Trong Dây (${groupMembers.reduce((s, m) => s + m.sharesCount, 0)} phần)
        </div>
      </div>

      <div class="item-list">
        ${groupMembers.map((gm, idx) => {
          const profile = store.state.profiles.find(p => p.id === gm.memberProfileId);
          const hasHoted = gm.hotedCycles && gm.hotedCycles.length > 0;
          return `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border-radius: 8px; border: 1px solid var(--border-color);">
              <div>
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span style="font-size: 12px; font-weight: 700; color: var(--text-muted); width: 20px;">#${idx + 1}</span>
                  <strong style="font-size: 14px; color: var(--text-main);">${profile?.fullName || 'Không rõ'}</strong>
                  ${profile?.nickname ? `<span style="font-size: 12px; color: var(--primary);">(${profile.nickname})</span>` : ''}
                </div>
                <div style="font-size: 11.5px; color: var(--text-muted); margin-left: 26px;">
                  📞 ${profile?.phone} • Tham gia: <strong>${gm.sharesCount} phần</strong>
                </div>
              </div>

              <span class="badge ${hasHoted ? 'badge-warning' : 'badge-success'}">
                ${hasHoted ? `Đã hốt kỳ ${gm.hotedCycles.join(',')}` : 'Hụi sống'}
              </span>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <!-- Lịch sử tất cả các kỳ hụi -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📜 Lịch sử các kỳ khui (${cycles.length})</div>
      </div>

      <div class="item-list">
        ${cycles.map(cyc => `
          <div style="background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="window.location.hash='#cycle-payments/${cyc.id}'">
            <div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <strong style="font-size: 14px;">Kỳ ${cyc.cycleNumber}</strong>
                <span style="font-size: 12px; color: var(--text-muted);">(${formatDate(cyc.openDate)})</span>
              </div>
              <div style="font-size: 12px; color: ${cyc.winnerMemberProfileId ? '#065f46' : 'var(--text-muted)'}; margin-top: 2px;">
                ${cyc.winnerMemberProfileId ? `🏆 Người hốt: <strong>${getMemberFullName(cyc.winnerMemberProfileId)}</strong> (Thăm: ${formatMoney(cyc.winningBidAmount)})` : 'Chưa khui hụi'}
              </div>
            </div>

            <div style="text-align: right;">
              <span class="badge ${cyc.status === 'closed' ? 'badge-gray' : 'badge-warning'}">
                ${cyc.status === 'closed' ? 'Đã chốt' : 'Đang mở'}
              </span>
              <div style="font-size: 11px; color: var(--primary); margin-top: 4px;">Chi tiết ➔</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // Xuất Excel
  document.getElementById('btn-export-group-excel')?.addEventListener('click', () => {
    const rows = [
      ['BẢNG KÊ DÂY HỤI - ' + group.name.toUpperCase()],
      ['Mức góp:', formatMoney(group.baseAmount), 'Tổng số phần:', group.totalParts, 'Chu kỳ:', getPeriodLabel(group.periodType)],
      ['Ngày bắt đầu:', formatDate(group.startDate), 'Quy định:', group.openDayRule],
      [''],
      ['STT', 'Họ và tên', 'Biệt danh', 'Số điện thoại', 'Số phần', 'Trạng thái', 'Kỳ đã hốt']
    ];

    groupMembers.forEach((gm, idx) => {
      const p = store.state.profiles.find(prof => prof.id === gm.memberProfileId);
      rows.push([
        idx + 1,
        p?.fullName || '',
        p?.nickname || '',
        p?.phone || '',
        gm.sharesCount,
        gm.hotedCycles.length > 0 ? 'Hụi chết' : 'Hụi sống',
        gm.hotedCycles.join(', ')
      ]);
    });

    exportToCSV(`SoHui_${group.name.replace(/\s+/g, '_')}.csv`, rows);
    showToast('Đã xuất file bảng kê hụi thành công!', 'success');
  });
}

function getMemberFullName(profileId) {
  const p = store.state.profiles.find(prof => prof.id === profileId);
  return p ? `${p.fullName} (${p.nickname})` : 'Chưa xác định';
}


/**
 * MÀN HÌNH KHUI HỤI (HỖ TRỢ 3 HÌNH THỨC: KÊU HỤI, BỎ THĂM KÍN, QUAY RANDOM)
 * Có lồng cầu quay số, loại trừ người nợ, lưu vết lý do nếu quay lại, chia sẻ kết quả
 */




function renderDrawScreen(container, groupId, cycleId) {
  const group = store.state.groups.find(g => g.id === groupId);
  const cycle = store.state.cycles.find(c => c.id === cycleId);

  if (!group || !cycle) {
    container.innerHTML = `
      <div class="card" style="text-align: center; padding: 30px;">
        <h3>Không tìm thấy kỳ hụi hoặc dây hụi!</h3>
        <button class="btn btn-primary" onclick="window.location.hash='#groups'">Quay lại</button>
      </div>
    `;
    return;
  }

  const groupMembers = store.state.groupMembers.filter(gm => gm.groupId === group.id);

  // Lọc danh sách ứng viên đủ điều kiện (CHƯA HỐT Ở BẤT KỲ KỲ NÀO)
  const allEligibleMembers = groupMembers.filter(gm => {
    // Nếu chưa từng hốt kỳ nào
    return !gm.hotedCycles || gm.hotedCycles.length === 0;
  });

  // Tách riêng những người đang có cảnh báo nợ / trễ hạn
  const cleanEligibleMembers = [];
  const inDebtMembers = [];

  allEligibleMembers.forEach(gm => {
    const prof = store.state.profiles.find(p => p.id === gm.memberProfileId);
    if (prof && (prof.latePaymentCount > 0 || prof.riskNote.length > 0 || gm.status === 'in_debt')) {
      inDebtMembers.push({ gm, prof });
    } else if (prof) {
      cleanEligibleMembers.push({ gm, prof });
    }
  });

  container.innerHTML = `
    <!-- Tiêu đề -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <button class="btn btn-sm btn-outline" style="margin-bottom: 6px;" onclick="window.location.hash='#group-detail/${group.id}'">
          ← Quay lại dây
        </button>
        <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">
          🎲 Khui Hụi Kỳ ${cycle.cycleNumber}
        </h2>
        <div style="font-size: 12.5px; color: var(--text-muted);">
          Dây: <strong>${group.name}</strong> • Mức góp: ${formatMoney(group.baseAmount)}
        </div>
      </div>
    </div>

    <!-- Chọn Chế Độ Khui Hụi -->
    <div class="card">
      <div class="card-title" style="font-size: 14px;">1. Chọn hình thức khui hụi</div>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
        <button class="btn btn-sm btn-mode ${group.drawMethod === 'random' ? 'btn-primary' : 'btn-outline'}" id="btn-tab-random">
          🎲 Quay Random
        </button>
        <button class="btn btn-sm btn-mode ${group.drawMethod === 'bidding' ? 'btn-primary' : 'btn-outline'}" id="btn-tab-bidding">
          🏷️ Kêu Bỏ Lãi
        </button>
        <button class="btn btn-sm btn-mode ${group.drawMethod === 'secret_ballot' ? 'btn-primary' : 'btn-outline'}" id="btn-tab-ballot">
          🗳️ Bỏ Thăm Kín
        </button>
      </div>
    </div>

    <!-- KHUNG CHỨA GIAO DIỆN THEO TỪNG CHẾ ĐỘ -->
    <div id="draw-mode-content"></div>
  `;

  let currentMode = group.drawMethod || 'random';

  function renderModeUI(mode) {
    const content = document.getElementById('draw-mode-content');
    if (!content) return;

    if (mode === 'random') {
      renderRandomMode(content);
    } else if (mode === 'bidding') {
      renderBiddingMode(content);
    } else {
      renderBallotMode(content);
    }
  }

  // --- 1. CHẾ ĐỘ QUAY RANDOM (MINH BẠCH, CÓ HIỆU ỨNG LỒNG CẦU) ---
  function renderRandomMode(target) {
    target.innerHTML = `
      <div class="card">
        <div class="card-title">2. Danh sách Hụi Viên đủ điều kiện quay</div>

        <div style="display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 8px 12px; border-radius: 8px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
            <input type="checkbox" id="cb-exclude-debt" checked style="width: 18px; height: 18px; accent-color: var(--accent);" />
            <span>Tự động loại trừ người đang có nợ / trễ hạn (${inDebtMembers.length} người)</span>
          </label>
        </div>

        <div class="item-list" style="max-height: 200px; overflow-y: auto;" id="random-candidates-list">
          <!-- Render danh sách người quay -->
        </div>
      </div>

      <!-- SÂN KHẤU LỒNG CẦU QUAY SỐ -->
      <div class="wheel-stage" id="lottery-stage">
        <div style="font-size: 15px; font-weight: 700; color: #fef08a;">LỒNG CẦU XỔ SỐ HỤI MINH BẠCH</div>
        <div class="lottery-cage" id="lottery-cage">
          <div class="lottery-ball" id="lottery-ball">🎲</div>
        </div>
        <div id="lottery-status-text" style="font-size: 13px; color: #94a3b8;">Sẵn sàng quay số ngẫu nhiên</div>

        <button class="btn btn-primary btn-block" id="btn-start-spin" style="background: linear-gradient(135deg, #f59e0b, #d97706); border: none; font-size: 16px; padding: 12px;">
          🎰 BẮT ĐẦU QUAY SỐ NGAY
        </button>
      </div>

      <!-- Khung kết quả người trúng sau khi quay xong -->
      <div id="random-winner-container" style="display: none;"></div>
    `;

    const candidatesList = document.getElementById('random-candidates-list');
    const cbExcludeDebt = document.getElementById('cb-exclude-debt');

    function updateCandidatesList() {
      const excludeDebt = cbExcludeDebt.checked;
      const activeCandidates = excludeDebt ? cleanEligibleMembers : [...cleanEligibleMembers, ...inDebtMembers];

      if (activeCandidates.length === 0) {
        candidatesList.innerHTML = `<div style="color:var(--text-muted); padding:10px;">Không còn ai đủ điều kiện để quay!</div>`;
        return;
      }

      candidatesList.innerHTML = activeCandidates.map(({ gm, prof }, idx) => {
        const isDebt = inDebtMembers.some(d => d.prof.id === prof.id);
        return `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: ${isDebt ? '#fff1f2' : '#f0fdf4'}; border-radius: 6px; font-size: 12.5px;">
            <div>
              <strong>#${idx + 1}. ${prof.fullName}</strong> (${prof.nickname})
              <div style="font-size: 11px; color: var(--text-muted);">📞 ${prof.phone} • ${gm.sharesCount} phần</div>
            </div>
            <span class="badge ${isDebt ? 'badge-danger' : 'badge-success'}">
              ${isDebt ? 'Có cảnh báo nợ' : 'Đủ chuẩn'}
            </span>
          </div>
        `;
      }).join('');
    }

    cbExcludeDebt.addEventListener('change', updateCandidatesList);
    updateCandidatesList();

    // Xử lý hiệu ứng quay số
    let isSpinning = false;
    document.getElementById('btn-start-spin')?.addEventListener('click', () => {
      if (isSpinning) return;

      const excludeDebt = cbExcludeDebt.checked;
      const pool = excludeDebt ? cleanEligibleMembers : [...cleanEligibleMembers, ...inDebtMembers];

      if (pool.length === 0) {
        showToast('Không có ai trong danh sách đủ điều kiện để quay!', 'danger');
        return;
      }

      isSpinning = true;
      const cage = document.getElementById('lottery-cage');
      const ball = document.getElementById('lottery-ball');
      const statusText = document.getElementById('lottery-status-text');
      const winnerContainer = document.getElementById('random-winner-container');

      cage.classList.add('spinning');
      statusText.innerText = 'Đang quay lồng cầu chọn ngẫu nhiên...';
      winnerContainer.style.display = 'none';

      // Nhấp nháy tên trong lúc quay
      let spinCounter = 0;
      const spinInterval = setInterval(() => {
        const randTemp = pool[Math.floor(Math.random() * pool.length)];
        ball.innerText = randTemp.prof.nickname || randTemp.prof.fullName.split(' ').pop();
        spinCounter++;
      }, 80);

      // Dừng lại sau 3.5 giây và chọn người thắng thực tế
      setTimeout(() => {
        clearInterval(spinInterval);
        cage.classList.remove('spinning');
        isSpinning = false;

        const winnerIndex = Math.floor(Math.random() * pool.length);
        const winner = pool[winnerIndex];

        ball.innerText = '🏆';
        statusText.innerText = `Chúc mừng ${winner.prof.fullName}!`;

        renderWinnerCard(winner, pool);
      }, 3500);
    });

    function renderWinnerCard(winner, pool) {
      const winnerContainer = document.getElementById('random-winner-container');
      const timestamp = new Date().toLocaleString('vi-VN');

      winnerContainer.innerHTML = `
        <div class="winner-card" id="winner-share-card">
          <div style="font-size: 32px;">🎉 🏆 🎊</div>
          <h3 style="font-size: 18px; font-weight: 800; margin-top: 4px;">KẾT QUẢ QUAY SỐ RANDOM</h3>
          <div style="font-size: 13px; margin-bottom: 8px;">DÂY HỤI: <strong>${group.name.toUpperCase()}</strong> - KỲ ${cycle.cycleNumber}</div>

          <div style="background: #ffffff; border-radius: 8px; padding: 12px; margin: 10px 0; border: 1px dashed #d97706; text-align: left;">
            <div style="font-size: 15px; font-weight: 800; color: #15803d; text-align: center;">
              🥇 NGƯỜI HỐT HỤI: ${winner.prof.fullName} (${winner.prof.nickname})
            </div>
            <div style="font-size: 12.5px; color: var(--text-muted); text-align: center; margin-top: 2px;">
              📞 SĐT: ${winner.prof.phone} • 📍 ${winner.prof.address || 'Miền Tây'}
            </div>
            <hr style="margin: 8px 0; border: none; border-top: 1px dashed #e2e8f0;" />
            <div style="display: flex; justify-content: space-between; font-size: 12px;">
              <span>Số người tham gia quay:</span>
              <strong>${pool.length} hụi viên</strong>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px;">
              <span>Thời gian quay số:</span>
              <strong>${timestamp}</strong>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px;">
              <span>Mã xác thực:</span>
              <code>SH-RAND-${Date.now().toString().slice(-6)}</code>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px;">
            <button class="btn btn-primary btn-block" id="btn-confirm-random-draw">
              ✅ Xác Nhận Kết Quả & Tạo Bảng Thu Tiền
            </button>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-outline btn-sm" id="btn-share-result" style="flex: 1;">
                📲 Chia Sẻ Kết Quả (Zalo)
              </button>
              <button class="btn btn-danger btn-sm" id="btn-redraw" style="flex: 1;">
                🔄 Quay Lại (Nếu Có Sự Cố)
              </button>
            </div>
          </div>
        </div>
      `;
      winnerContainer.style.display = 'block';

      // Xác nhận kết quả
      document.getElementById('btn-confirm-random-draw')?.addEventListener('click', () => {
        try {
          const eligibleIds = pool.map(p => p.prof.id);
          const excludedNames = inDebtMembers.map(d => `${d.prof.fullName} (${d.prof.riskNote || 'Có nợ'})`);

          store.executeCycleDraw(cycle.id, winner.prof.id, 0, 'random', {
            eligibleCandidates: eligibleIds,
            excludedCandidates: excludedNames
          });

          showToast(`Đã ghi nhận kết quả khui hụi cho ${winner.prof.fullName}!`, 'success');
          window.location.hash = `#cycle-payments/${cycle.id}`;
        } catch (err) {
          showToast(err.message, 'danger');
        }
      });

      // Chia sẻ kết quả
      document.getElementById('btn-share-result')?.addEventListener('click', () => {
        const text = `📢 KẾT QUẢ KHUI HỤI RANDOM MINH BẠCH\n- Dây hụi: ${group.name}\n- Kỳ khui: Kỳ số ${cycle.cycleNumber}\n- Người trúng: ${winner.prof.fullName} (${winner.prof.nickname})\n- Thời gian quay: ${timestamp}\n(Ứng dụng Quản lý Sổ Hụi)`;
        navigator.clipboard?.writeText(text);
        showToast('Đã sao chép nội dung kết quả! Bạn có thể dán gửi vào Zalo/Messenger.', 'success');
      });

      // Quay lại có ghi chú lý do bắt buộc
      document.getElementById('btn-redraw')?.addEventListener('click', () => {
        const reason = prompt('Vui lòng nhập lý do quay lại (Bắt buộc để lưu nhật ký kiểm toán):');
        if (!reason || reason.trim().length === 0) {
          showToast('Bắt buộc phải nhập lý do khi quay lại!', 'warning');
          return;
        }

        store.logAction('RANDOM_DRAW', 'HuiCycle', cycle.id, `Quay lại Random Kỳ ${cycle.cycleNumber} Dây "${group.name}". Lý do: ${reason}`);
        showToast('Đã lưu lý do quay lại vào nhật ký!', 'info');
        renderModeUI('random');
      });
    }
  }

  // --- 2. CHẾ ĐỘ KÊU HỤI / BỎ LÃI TRỰC TIẾP ---
  function renderBiddingMode(target) {
    target.innerHTML = `
      <div class="card">
        <div class="card-title">2. Nhập Mức Kêu Hụi / Bỏ Lãi Công Khai</div>
        <p style="font-size:12.5px; color:var(--text-muted);">
          Ai chịu bỏ mức thăm cao nhất thì người đó trúng hụi kỳ này. Hụi sống sẽ được trừ đúng số tiền thăm đó.
        </p>

        <div class="form-group">
          <label class="form-label">Chọn người trúng hụi (Kêu giá cao nhất):</label>
          <select id="select-bidding-winner" class="form-control form-select">
            ${allEligibleMembers.map(gm => {
              const p = store.state.profiles.find(prof => prof.id === gm.memberProfileId);
              return `<option value="${p.id}">${p.fullName} (${p.nickname}) - ${gm.sharesCount} phần</option>`;
            }).join('')}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Số tiền thăm kêu trúng (VNĐ/phần) (*):</label>
          <input type="number" id="input-bidding-amount" class="form-control" placeholder="VD: 300000" step="10000" required />
          <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">
            Ví dụ bỏ thăm 300.000đ: Hụi viên hụi sống chỉ phải nộp: <strong>${formatMoney(group.baseAmount - 300000)}</strong>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="btn-confirm-bidding">
          🏷️ Xác Nhận Khui Hụi Kêu Lãi
        </button>
      </div>
    `;

    document.getElementById('btn-confirm-bidding')?.addEventListener('click', () => {
      const winnerId = document.getElementById('select-bidding-winner').value;
      const bid = Number(document.getElementById('input-bidding-amount').value);

      if (isNaN(bid) || bid < 0) {
        showToast('Vui lòng nhập mức tiền thăm hợp lệ!', 'warning');
        return;
      }

      try {
        store.executeCycleDraw(cycle.id, winnerId, bid, 'bidding');
        showToast('Khui hụi thành công!', 'success');
        window.location.hash = `#cycle-payments/${cycle.id}`;
      } catch (err) {
        showToast(err.message, 'danger');
      }
    });
  }

  // --- 3. CHẾ ĐỘ BỎ THĂM KÍN ---
  function renderBallotMode(target) {
    target.innerHTML = `
      <div class="card">
        <div class="card-title">2. Nhập Phiếu Thăm Kín Của Các Hụi Viên</div>
        <p style="font-size:12.5px; color:var(--text-muted);">
          Nhập số tiền ghi trong phiếu kín của từng người. Ứng dụng sẽ tự động tìm ra người bỏ cao nhất để trao hụi.
        </p>

        <div class="item-list">
          ${allEligibleMembers.map(gm => {
            const p = store.state.profiles.find(prof => prof.id === gm.memberProfileId);
            return `
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #f8fafc; border-radius: 6px;">
                <div>
                  <strong style="font-size: 13.5px;">${p.fullName}</strong>
                  <div style="font-size: 11px; color: var(--text-muted);">${p.nickname}</div>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span style="font-size: 12px; color: var(--text-muted);">Mức thăm:</span>
                  <input type="number" class="form-control input-ballot-val" data-id="${p.id}" placeholder="0" step="10000" style="width: 110px; padding: 6px;" />
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <button class="btn btn-primary btn-block" id="btn-open-ballots" style="margin-top: 10px;">
          🗳️ Mở Phiếu Thăm & Tìm Người Trúng
        </button>
      </div>
    `;

    document.getElementById('btn-open-ballots')?.addEventListener('click', () => {
      let maxBid = -1;
      let winnerId = null;

      container.querySelectorAll('.input-ballot-val').forEach(inp => {
        const val = Number(inp.value) || 0;
        if (val > maxBid) {
          maxBid = val;
          winnerId = inp.getAttribute('data-id');
        }
      });

      if (!winnerId || maxBid < 0) {
        showToast('Vui lòng nhập ít nhất một mức thăm hợp lệ!', 'warning');
        return;
      }

      const winnerProf = store.state.profiles.find(p => p.id === winnerId);
      if (confirm(`Kết quả mở thăm kín:\nNgười bỏ cao nhất là ${winnerProf.fullName} với mức thăm: ${formatMoney(maxBid)}.\nBạn có xác nhận người này trúng hụi không?`)) {
        try {
          store.executeCycleDraw(cycle.id, winnerId, maxBid, 'secret_ballot');
          showToast(`Khui hụi thành công cho ${winnerProf.fullName}!`, 'success');
          window.location.hash = `#cycle-payments/${cycle.id}`;
        } catch (err) {
          showToast(err.message, 'danger');
        }
      }
    });
  }

  // Gán tab chuyển chế độ
  document.getElementById('btn-tab-random')?.addEventListener('click', () => {
    currentMode = 'random';
    setActiveTab('btn-tab-random');
    renderModeUI('random');
  });

  document.getElementById('btn-tab-bidding')?.addEventListener('click', () => {
    currentMode = 'bidding';
    setActiveTab('btn-tab-bidding');
    renderModeUI('bidding');
  });

  document.getElementById('btn-tab-ballot')?.addEventListener('click', () => {
    currentMode = 'secret_ballot';
    setActiveTab('btn-tab-ballot');
    renderModeUI('secret_ballot');
  });

  function setActiveTab(btnId) {
    container.querySelectorAll('.btn-mode').forEach(b => {
      b.className = 'btn btn-sm btn-mode btn-outline';
    });
    const active = document.getElementById(btnId);
    if (active) active.className = 'btn btn-sm btn-mode btn-primary';
  }

  renderModeUI(currentMode);
}


/**
 * QUẢN LÝ ĐÓNG TIỀN, BIÊN NHẬN & CHỐT SỔ KỲ HỤI (PAYMENTS & RECEIPTS)
 * Ghi nhận tiền mặt / chuyển khoản, xem/in biên nhận điện tử, xuất PDF/Excel, chốt sổ
 */




function renderCyclePayments(container, cycleId) {
  const cycle = store.state.cycles.find(c => c.id === cycleId);
  if (!cycle) {
    container.innerHTML = `
      <div class="card" style="text-align: center; padding: 30px;">
        <h3>Không tìm thấy kỳ hụi!</h3>
        <button class="btn btn-primary" onclick="window.location.hash='#groups'">Quay lại</button>
      </div>
    `;
    return;
  }

  const group = store.state.groups.find(g => g.id === cycle.groupId);
  const payments = store.state.payments.filter(p => p.cycleId === cycle.id);
  const winnerProfile = store.state.profiles.find(p => p.id === cycle.winnerMemberProfileId);

  // Thống kê tổng tiền thu
  const totalPaid = payments.reduce((sum, p) => sum + (p.amountPaid || 0), 0);
  const totalDue = payments.reduce((sum, p) => sum + (p.amountDue || 0), 0);
  const remaining = totalDue - totalPaid;
  const isAllPaid = remaining <= 0 && payments.length > 0;

  container.innerHTML = `
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <button class="btn btn-sm btn-outline" style="margin-bottom: 6px;" onclick="window.location.hash='#group-detail/${group.id}'">
          ← Dây hụi
        </button>
        <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main);">
          💳 Bảng Thu Tiền Kỳ ${cycle.cycleNumber}
        </h2>
        <div style="font-size: 12.5px; color: var(--text-muted);">
          Dây: <strong>${group.name}</strong> • Ngày khui: ${formatDate(cycle.openDate)}
        </div>
      </div>
      <span class="badge ${cycle.status === 'closed' ? 'badge-gray' : 'badge-warning'}">
        ${cycle.status === 'closed' ? 'Đã chốt sổ' : 'Đang mở thu tiền'}
      </span>
    </div>

    <!-- Thông tin người trúng hốt & số tiền thực nhận -->
    ${winnerProfile ? `
      <div class="card highlight" style="padding: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-size: 12px; color: var(--text-muted);">Người hốt kỳ này:</div>
            <strong style="font-size: 15px; color: var(--primary-dark);">🏆 ${winnerProfile.fullName} (${winnerProfile.nickname})</strong>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 11.5px; color: var(--text-muted);">Tiền hốt thực nhận:</div>
            <strong style="font-size: 16px; color: var(--primary);">${formatMoney(cycle.potAmount)}</strong>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #bbf7d0;">
          <span>Mức thăm trúng: <strong>${formatMoney(cycle.winningBidAmount)}</strong></span>
          <span>Tiền thảo chủ hụi: <strong>${formatMoney(cycle.commissionAmount)}</strong></span>
        </div>
      </div>
    ` : ''}

    <!-- Thống kê tiến độ thu tiền -->
    <div class="stats-grid">
      <div class="stat-box" style="border-left: 4px solid var(--primary);">
        <span class="stat-label">Đã thu thực tế</span>
        <span class="stat-val money">${formatMoney(totalPaid)}</span>
      </div>
      <div class="stat-box" style="border-left: 4px solid var(--accent);">
        <span class="stat-label">Còn thiếu / Chưa nộp</span>
        <span class="stat-val danger">${formatMoney(remaining)}</span>
      </div>
    </div>

    <!-- Nút Xuất Báo Cáo & In Phiếu -->
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-sm btn-outline" id="btn-export-payments-excel" style="flex: 1;">
        📊 Xuất Excel Kỳ
      </button>
      ${cycle.status === 'open' ? `
        <button class="btn btn-sm btn-primary" id="btn-close-cycle-action" style="flex: 1; background: #047857;">
          🔒 Chốt Sổ Kỳ Này
        </button>
      ` : `
        <button class="btn btn-sm btn-outline" disabled style="flex: 1;">
          ✅ Kỳ Này Đã Khóa
        </button>
      `}
    </div>

    <!-- Danh sách các khoản đóng của từng hụi viên -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          📋 Danh sách chi tiết đóng tiền (${payments.length})
        </div>
      </div>

      <div class="item-list">
        ${payments.map(p => {

          const isPaid = p.status === 'paid';
          const isLate = p.status === 'late';

          return `
            <div class="card" style="padding: 12px; border-left: 4px solid ${isWinner ? 'var(--blue)' : (isPaid ? 'var(--primary)' : 'var(--accent)')};">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <div style="display: flex; align-items: center; gap: 6px;">
                    <strong style="font-size: 14.5px;">${profile?.fullName}</strong>
                    ${profile?.nickname ? `<span style="font-size: 12px; color: var(--primary);">(${profile.nickname})</span>` : ''}
                    ${isWinner ? `<span class="badge badge-info">Người hốt</span>` : ''}
                  </div>
                  <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                    ${p.sharesCount} phần • <strong>${p.isDeadHui ? 'Hụi chết (đóng đủ)' : 'Hụi sống'}</strong>

                <div style="text-align: right;">

                    ${formatMoney(p.amountDue)}

                  <span class="badge ${isPaid ? 'badge-success' : (isLate ? 'badge-danger' : 'badge-warning')}">

                  Phương thức: <strong>${p.paymentMethod === 'transfer' ? 'Chuyển khoản' : 'Tiền mặt'}</strong>
                  ${p.transactionRef ? ` (${p.transactionRef})` : ''}
                </span>
                <span>${p.paidAt ? formatDate(p.paidAt) : 'Chưa thu'}</span>
              </div>

              <!-- Thao tác -->
              <div style="display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-color);">
                ${!isWinner ? `
                  <button class="btn btn-sm btn-outline btn-record-single" data-id="${p.id}">
                    ${isPaid ? '✏️ Sửa số tiền' : '💰 Ghi nhận thu tiền'}

                ` : ''}
                ${isPaid && !isWinner ? `
                  <button class="btn btn-sm btn-outline btn-view-receipt-payment" data-pay-id="${p.id}">
                    🧾 Xem biên nhận
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <!-- Modal Ghi Nhận Thu Tiền -->
    <div id="modal-record-payment" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">Ghi Nhận Đóng Tiền Hụi</h3>
          <button class="btn btn-sm btn-outline btn-circle" id="btn-close-payment-modal">✕</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="form-payment-id" />

          <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px;">
            <div style="font-size: 12px; color: var(--text-muted);">Hụi viên:</div>
            <strong style="font-size: 15px; color: var(--primary-dark);" id="modal-pay-member-name"></strong>
            <div style="font-size: 13px; margin-top: 4px;">
              Số tiền phải đóng: <strong style="color: var(--accent);" id="modal-pay-amount-due"></strong>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Số tiền thực tế đã thu (*):</label>
            <input type="number" id="form-pay-amount-paid" class="form-control" step="10000" required />
          </div>

          <div class="form-group">
            <label class="form-label">Hình thức thanh toán:</label>
            <select id="form-pay-method" class="form-control form-select">
              <option value="transfer">Chuyển khoản Ngân hàng / Ví điện tử</option>
              <option value="cash">Tiền mặt trao tay</option>
            </select>
          </div>

          <div class="form-group" id="group-tx-ref">
            <label class="form-label">Mã giao dịch / Ngân hàng (Nếu CK):</label>
            <input type="text" id="form-pay-txref" class="form-control" placeholder="VD: VCB.20260917.88123" />
          </div>

          <div class="form-group">
            <label class="form-label">Ghi chú thêm:</label>
            <input type="text" id="form-pay-note" class="form-control" placeholder="VD: Đóng trước 1 ngày, gửi tại nhà..." />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" id="btn-cancel-pay-modal" style="flex: 1;">Hủy</button>
          <button class="btn btn-primary" id="btn-save-payment-modal" style="flex: 2;">💾 Lưu & Xuất Biên Nhận</button>
        </div>
      </div>
    </div>

    <!-- Modal Xem & In Biên Nhận Điện Tử -->
    <div id="modal-receipt-view" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">🧾 Biên Nhận Thu Tiền Hụi</h3>
          <button class="btn btn-sm btn-outline btn-circle" id="btn-close-receipt-modal">✕</button>
        </div>
        <div class="modal-body" id="receipt-modal-body">
          <!-- In nội dung biên nhận -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" id="btn-print-receipt" style="flex: 1;">🖨️ In / Lưu PDF</button>
          <button class="btn btn-primary" id="btn-share-receipt-zalo" style="flex: 1;">📲 Gửi Zalo</button>
        </div>
      </div>
    </div>
  `;

  // Sự kiện ghi nhận đóng tiền
  const modalPay = document.getElementById('modal-record-payment');
  container.querySelectorAll('.btn-record-single').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const pid = e.currentTarget.getAttribute('data-id');
      const p = payments.find(pay => pay.id === pid);
      const prof = store.state.profiles.find(prof => prof.id === p.memberProfileId);

      if (p && prof) {
        document.getElementById('form-payment-id').value = p.id;
        document.getElementById('modal-pay-member-name').innerText = `${prof.fullName} (${prof.nickname})`;
        document.getElementById('modal-pay-amount-due').innerText = formatMoney(p.amountDue);
        document.getElementById('form-pay-amount-paid').value = p.amountPaid > 0 ? p.amountPaid : p.amountDue;
        document.getElementById('form-pay-method').value = p.paymentMethod || 'transfer';
        document.getElementById('form-pay-txref').value = p.transactionRef || '';
        document.getElementById('form-pay-note').value = p.note || '';
        modalPay.style.display = 'flex';
      }
    });
  });

  document.getElementById('btn-close-payment-modal')?.addEventListener('click', () => modalPay.style.display = 'none');
  document.getElementById('btn-cancel-pay-modal')?.addEventListener('click', () => modalPay.style.display = 'none');

  document.getElementById('btn-save-payment-modal')?.addEventListener('click', () => {
    const paymentId = document.getElementById('form-payment-id').value;
    const amountPaid = Number(document.getElementById('form-pay-amount-paid').value);
    const paymentMethod = document.getElementById('form-pay-method').value;
    const transactionRef = document.getElementById('form-pay-txref').value.trim();
    const note = document.getElementById('form-pay-note').value.trim();

    if (isNaN(amountPaid) || amountPaid < 0) {
      showToast('Vui lòng nhập số tiền hợp lệ!', 'warning');
      return;
    }

    try {
      const res = store.recordPayment(paymentId, {
        amountPaid,
        paymentMethod,
        transactionRef,
        note
      });

      showToast('Ghi nhận thanh toán thành công!', 'success');
      modalPay.style.display = 'none';
      renderCyclePayments(container, cycle.id);
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  // Chốt sổ kỳ hụi
  document.getElementById('btn-close-cycle-action')?.addEventListener('click', () => {
    if (remaining > 0) {
      if (!confirm(`⚠️ CẢNH BÁO:\nHiện tại vẫn còn ${formatMoney(remaining)} chưa được nộp đầy đủ.\nBạn có chắc chắn muốn chốt sổ kỳ này không? (Chủ hụi sẽ ghi nhận nợ cho các thành viên chưa đóng).`)) {
        return;
      }
    } else {
      if (!confirm(`Xác nhận chốt sổ hoàn tất Kỳ ${cycle.cycleNumber} của Dây "${group.name}"? Hệ thống sẽ chuyển sang kỳ tiếp theo.`)) {
        return;
      }
    }

    try {
      store.closeCycle(cycle.id);
      showToast(`Đã chốt sổ thành công Kỳ ${cycle.cycleNumber}!`, 'success');
      window.location.hash = `#group-detail/${group.id}`;
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });
